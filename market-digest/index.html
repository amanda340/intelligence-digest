.lift{transition:transform .18s,box-shadow .18s;cursor:pointer}

a{text-decoration:none;color:inherit}
button{cursor:pointer;font-family:inherit}

}

function srcOf(n){const x=(n||"").toLowerCase();return SRC_MAP.find(s=>s.m.some(m=>x.includes(m)))||{s:"—",c:"#6B7280",b:"#F3F4F6"};}

/* ──────────────────────────────────────────
   Helpers
────────────────────────────────────────── */
function readTime(t){return Math.max(1,Math.round((t||"").split(" ").length/200));}
function getTrackItems(feed,id){
  if(!feed?.tracks)return[];
  const v=feed.tracks[id];
  if(!v)return[];
  return Array.isArray(v)?v:(v.d||[]);
}
function allFeedItems(feed){
  if(!feed?.tracks)return[];
  return Object.entries(feed.tracks).flatMap(([t,v])=>
    (Array.isArray(v)?v:(v.d||[])).map(i=>({...i,_track:t}))
  );
}
function tf(item,field,lang){
  if(lang==="pt")return item[field]||"";
  return item[`${field}_${lang}`]||item[field]||"";
}

/* ──────────────────────────────────────────
   Components — Cover
────────────────────────────────────────── */
function Cover({tag,h=170,rTop=true,rBottom=false,stretch=false}){
  const [a,b]=GRAD[tag]||GRAD._default;
  const r=[rTop?"14px":"0",rTop?"14px":"0",rBottom?"14px":"0",rBottom?"14px":"0"].join(" ");
  return(
    <div style={{height:stretch?"100%":h,minHeight:h,
      background:`linear-gradient(135deg,${a} 0%,${b} 100%)`,
      borderRadius:r,position:"relative",overflow:"hidden",flexShrink:0}}>
      {/* dot pattern */}
      <div style={{position:"absolute",inset:0,
        backgroundImage:"radial-gradient(rgba(255,255,255,.15) 1px,transparent 1px)",
        backgroundSize:"20px 20px"}}/>
      {/* deco circles */}
      <div style={{position:"absolute",right:-60,top:-60,width:200,height:200,
        borderRadius:"50%",background:"rgba(255,255,255,.12)"}}/>
      <div style={{position:"absolute",left:-36,bottom:-36,width:140,height:140,
        borderRadius:"50%",background:"rgba(0,0,0,.14)"}}/>
      <div style={{position:"absolute",right:32,bottom:36,width:60,height:60,
        borderRadius:"50%",background:"rgba(255,255,255,.08)"}}/>
      {/* gradient overlay */}
      <div style={{position:"absolute",inset:0,
        background:"linear-gradient(to top,rgba(0,0,0,.48) 0%,transparent 60%)"}}/>
      {/* tag pill */}
      <div style={{position:"absolute",bottom:12,left:14}}>
        <span style={{background:"rgba(255,255,255,.18)",backdropFilter:"blur(16px)",
          WebkitBackdropFilter:"blur(16px)",color:"#FFF",fontSize:10.5,fontWeight:700,
          letterSpacing:"1.4px",textTransform:"uppercase",padding:"4px 10px",
          borderRadius:99,border:"1px solid rgba(255,255,255,.3)"}}>
          {tag}
        </span>
      </div>
    </div>
  );
}

/* ── Role badge ─── */
function RoleBadge({r}){
  const a=AUD[r];if(!a)return null;
  return(
    <span style={{background:a.b,color:a.c,fontSize:10,fontWeight:700,
      padding:"2px 7px",borderRadius:99,border:`1px solid ${a.c}28`,
      whiteSpace:"nowrap",letterSpacing:"0.02em"}}>
      {a.l}
    </span>
  );
}

/* ── Source badge ─── */
function SrcBadge({name,size=20}){
  const s=srcOf(name);
  return(
    <span style={{width:size,height:size,borderRadius:"50%",background:s.b,color:s.c,
      fontSize:size*.38,fontWeight:800,display:"inline-flex",alignItems:"center",
      justifyContent:"center",flexShrink:0,border:`1.5px solid ${s.c}22`,
      letterSpacing:"-0.5px"}}>
      {s.s}
    </span>
  );
}

/* ── Reference links ─── */
function RefLinks({urls,url,t}){
  const all=useMemo(()=>{
    const list=Array.isArray(urls)?[...urls]:[];
    if(url&&!list.includes(url))list.unshift(url);
    return list.filter(Boolean);
  },[urls,url]);
  if(!all.length)return null;
  return(
    <div style={{display:"flex",flexWrap:"wrap",gap:5,marginTop:2}}>
      {all.map((u,i)=>(
        <a key={i} href={u} target="_blank" rel="noopener"
           onClick={e=>e.stopPropagation()}
           style={{display:"inline-flex",alignItems:"center",gap:3,
             background:"#F3F4F6",border:"1px solid #E5E7EB",
             borderRadius:6,padding:"3px 8px",
             fontSize:11,color:"#374151",fontWeight:500,flexShrink:0}}>
          {t.references} {all.length>1?`[${i+1}]`:"↗"}
        </a>
      ))}
    </div>
  );
}

/* ── Expandable analysis panels ─── */
function AnalysisPanels({item,lang,t,open}){
  if(!open)return null;
  const d=tf(item,"d",lang);
  const c=tf(item,"critical",lang);
  return(
    <div style={{display:"flex",flexDirection:"column",gap:8}}>
      {d&&(
        <div style={{background:"#F5F3FF",border:"1px solid #DDD6FE",borderRadius:8,padding:"10px 13px"}}>
          <p style={{margin:0,fontSize:12.5,color:"#5B21B6",lineHeight:1.65}}>
            <strong style={{display:"block",marginBottom:3}}>🏛 {t.decision}</strong>{d}
          </p>
        </div>
      )}
      {c&&(
        <div style={{background:"#FFF7ED",border:"1px solid #FED7AA",borderRadius:8,padding:"10px 13px"}}>
          <p style={{margin:0,fontSize:12.5,color:"#9A3412",lineHeight:1.65}}>
            <strong style={{display:"block",marginBottom:3}}>🔍 {t.critical}</strong>{c}
          </p>
        </div>
      )}
    </div>
  );
}

/* ── Featured hero card ─── */
function Featured({item,lang,t}){
  const [open,setOpen]=useState(false);
  const auds=Array.isArray(item.aud)?item.aud:[];
  const hasAnalysis=!!(tf(item,"d",lang)||tf(item,"critical",lang));
  return(
    <div className="lift hero-split" onClick={()=>hasAnalysis&&setOpen(v=>!v)}
      style={{display:"flex",background:"#FFF",borderRadius:16,overflow:"hidden",
        border:"1px solid #E5E7EB",boxShadow:"0 2px 8px rgba(0,0,0,.06)",
        cursor:hasAnalysis?"pointer":"default"}}>
      <div className="hero-img" style={{flex:"0 0 36%",alignSelf:"stretch",borderRadius:"16px 0 0 16px",overflow:"hidden",maxHeight:220}}>
        <Cover tag={item.tag} stretch h={220} rTop={false} rBottom={false}/>
      </div>
      <div style={{flex:1,padding:"20px 26px",display:"flex",flexDirection:"column",gap:10,overflow:"hidden"}}>
        <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
          <SrcBadge name={item.f} size={22}/>
          <span style={{fontSize:12.5,color:"#374151",fontWeight:500}}>{item.f}</span>
          <span style={{color:"#D1D5DB"}}>·</span>
          <span style={{fontSize:12.5,color:"#9CA3AF"}}>{item.dt}</span>
          {item.alert&&(
            <span style={{marginLeft:"auto",background:"#FEF2F2",color:"#B91C1C",
              fontSize:11,fontWeight:700,padding:"3px 10px",borderRadius:99,
              border:"1px solid #FECACA",flexShrink:0,animation:"pulse 2s infinite"}}>
              ⚡ URGENTE
            </span>
          )}
        </div>
        <h2 className="serif" style={{fontSize:22,fontWeight:700,color:"#111",lineHeight:1.32,
          display:"-webkit-box",WebkitLineClamp:2,WebkitBoxOrient:"vertical",overflow:"hidden"}}>
          {tf(item,"t",lang)}
        </h2>
        <p style={{fontSize:13.5,color:"#4B5563",lineHeight:1.72,
          display:"-webkit-box",WebkitLineClamp:3,WebkitBoxOrient:"vertical",overflow:"hidden"}}>
          {tf(item,"s",lang)}
        </p>
        <AnalysisPanels item={item} lang={lang} t={t} open={open}/>
        <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap",
          marginTop:"auto",paddingTop:14,borderTop:"1px solid #F3F4F6"}}>
          {auds.map(r=><RoleBadge key={r} r={r}/>)}
          <span style={{flex:1}}/>
          <RefLinks urls={item.urls} url={item.url} t={t}/>
          {hasAnalysis&&(
            <span style={{color:"#6D28D9",fontSize:12.5,fontWeight:500}}>
              {open?t.close:t.see}
            </span>
          )}
        </div>
      </div>
    </div>
  );
}

/* ── Social Signals bar ─── */
function SocialSignals({signals}){
  if(!signals)return null;
  const {hn_comments,hn_url,reddit_posts,reddit_url,stock,stock_change,stock_comment,layoff}=signals;
  const items=[];

  if(hn_comments>0) items.push(
    <a key="hn" href={hn_url||"#"} target="_blank" rel="noopener"
       onClick={e=>e.stopPropagation()}
       style={{display:"inline-flex",alignItems:"center",gap:3,
         background:"#FEF3C7",color:"#92400E",border:"1px solid #FDE68A",
         borderRadius:99,padding:"2px 8px",fontSize:10.5,fontWeight:600,
         textDecoration:"none",flexShrink:0}}>
      🔶 HN {hn_comments}
    </a>
  );

  if(reddit_posts>0) items.push(
    <a key="r" href={reddit_url||"#"} target="_blank" rel="noopener"
       onClick={e=>e.stopPropagation()}
       style={{display:"inline-flex",alignItems:"center",gap:3,
         background:"#FEF2F2",color:"#C2410C",border:"1px solid #FECACA",
         borderRadius:99,padding:"2px 8px",fontSize:10.5,fontWeight:600,
         textDecoration:"none",flexShrink:0}}>
      🔴 r/ {reddit_posts}
    </a>
  );

  if(stock){
    const up=stock_change>=0;
    items.push(
      <span key="stk" title={stock_comment||""}
        style={{display:"inline-flex",alignItems:"center",gap:3,
          background:up?"#F0FDF4":"#FEF2F2",
          color:up?"#059669":"#DC2626",
          border:`1px solid ${up?"#BBF7D0":"#FECACA"}`,
          borderRadius:99,padding:"2px 8px",fontSize:10.5,fontWeight:600,flexShrink:0,
          cursor:stock_comment?"help":"default"}}>
        {stock} {up?"▲":"▼"}{Math.abs(stock_change).toFixed(1)}%
        {stock_comment&&<span style={{fontSize:9,opacity:.7,maxWidth:80,overflow:"hidden",
          textOverflow:"ellipsis",whiteSpace:"nowrap"}}> · {stock_comment}</span>}
      </span>
    );
  }

  if(layoff) items.push(
    <span key="lay"
      style={{display:"inline-flex",alignItems:"center",gap:3,
        background:"#FFF7ED",color:"#9A3412",border:"1px solid #FED7AA",
        borderRadius:99,padding:"2px 8px",fontSize:10.5,fontWeight:600,flexShrink:0}}>
      📉 {layoff}
    </span>
  );

  if(items.length===0)return null;
  return(
    <div style={{display:"flex",gap:5,flexWrap:"wrap",paddingTop:8,
      borderTop:"1px solid #F3F4F6"}}>
      {items}

/* ──────────────────────────────────────────
   App
────────────────────────────────────────── */
function App(){
  const [feed,setFeed]=useState(null);
  const [loading,setLoading]=useState(true);
  const [error,setError]=useState(null);
  const [track,setTrack]=useState("all");
  const [search,setSearch]=useState("");
  const [audFilter,setAudFilter]=useState(null);
  const [period,setPeriod]=useState(null); // null=todos, 7=7d, 30=30d, 90=3m
  const [lang,setLang]=useState("pt");

  const t=I18N[lang]||I18N.pt;

  useEffect(()=>{
    fetch(FEED+"?v="+Date.now())
      .then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.json();})
      .then(d=>{setFeed(d);setLoading(false);})
      .catch(e=>{setError(e.message);setLoading(false);});
  },[]);

  const items=useMemo(()=>allFeedItems(feed),[feed]);
  const featured=useMemo(()=>items.find(i=>i.alert)||items[0],[items]);
  const alertCount=useMemo(()=>items.filter(i=>i.alert).length,[items]);
  const genAt=feed?.generatedAt
    ?new Date(feed.generatedAt).toLocaleDateString("pt-BR",{day:"2-digit",month:"long",year:"numeric"})
    :"";

  const visibleSections=useMemo(()=>{
    if(!feed)return[];
    return TRACK_IDS.filter(id=>id!=="all").map((id,i)=>({
      id,
      label:t.tracks[i+1]||id,
      items:(() => {
        let list=getTrackItems(feed,id);
        if(period){
          const cutoff=new Date();cutoff.setDate(cutoff.getDate()-period);
          list=list.filter(it=>{
            const d=new Date(it.dt);return!isNaN(d)&&d>=cutoff;
          });
        }
        if(audFilter)list=list.filter(it=>(it.aud||[]).includes(audFilter));
        if(search.trim()){const q=search.toLowerCase();list=list.filter(it=>(it.t+it.s+(it.tag||"")+it.f||"").toLowerCase().includes(q));}
        return list;
      })(),
      variant:id==="issues"?"issue":id==="releases"?"release":id==="social"?"social":id==="acquisitions"?"acquisitions":"default",
    })).filter(s=>s.items.length>0);
  },[feed,search,audFilter,period,lang,t]);

  const visible=useMemo(()=>
    track==="all"?visibleSections:visibleSections.filter(s=>s.id===track)
  ,[visibleSections,track]);

  const trackCounts=useMemo(()=>{
    const m={all:items.length};
    TRACK_IDS.filter(id=>id!=="all").forEach(id=>{m[id]=getTrackItems(feed,id).length;});
    return m;
  },[feed,items]);

  return(
    <div style={{background:"#F3F4F6",minHeight:"100vh"}}>

      {/* ── HEADER ── */}
      <header style={{background:"#FFF",borderBottom:"1px solid #E5E7EB",
        position:"sticky",top:0,zIndex:30,boxShadow:"0 1px 4px rgba(0,0,0,.05)"}}>
        <div style={{maxWidth:1360,margin:"0 auto",padding:"0 14px"}}>

          {/* LINHA 1: título + alertas + status */}
          <div style={{display:"flex",alignItems:"center",paddingTop:10,paddingBottom:6,gap:6,flexWrap:"wrap"}}>
            <span className="serif" style={{fontSize:20,fontWeight:800,color:RED,letterSpacing:"-0.5px",flexShrink:0}}>Intelligence Digest</span>
            {alertCount>0&&(
              <span style={{background:"#FEF2F2",color:RED,fontSize:11,fontWeight:700,
                padding:"3px 9px",borderRadius:99,border:`1px solid ${RED}28`,flexShrink:0}}>
                ⚡ {alertCount} {t.alerts}
              </span>
            )}
            {genAt&&(
              <span style={{fontSize:10,color:"#9CA3AF",display:"flex",alignItems:"center",gap:4,flexShrink:0}}>
                <span style={{width:6,height:6,borderRadius:"50%",background:"#10B981",display:"inline-block",animation:"pulse 2s infinite"}}/>
                {genAt}
              </span>
            )}
          </div>
          {/* LINHA 2: busca + idiomas */}
          <div style={{display:"flex",alignItems:"center",gap:6,paddingBottom:8,borderBottom:"1px solid #F3F4F6",flexWrap:"wrap"}}>
            <input type="search" placeholder={t.search} value={search}
              onChange={e=>setSearch(e.target.value)}
              style={{padding:"6px 13px",borderRadius:99,border:"1px solid #E5E7EB",
                background:"#F9FAFB",color:"#111",fontFamily:"inherit",fontSize:12.5,
                flex:1,minWidth:120,outline:"none"}}/>
            {["pt","en","es"].map(l=>(
              <button key={l} onClick={()=>setLang(l)} style={{
                padding:"5px 10px",borderRadius:6,border:"1px solid #E5E7EB",
                background:lang===l?RED:"transparent",
                color:lang===l?"#FFF":"#6B7280",
                fontSize:12,fontWeight:600,transition:"all .15s",flexShrink:0,
              }}>
                {l.toUpperCase()}
              </button>
            ))}
          </div>

          {/* track nav */}
          <div className="hscroll" style={{height:42,alignItems:"center",gap:1,padding:"0"}}>
            {TRACK_IDS.map((id,i)=>{
              const cnt=trackCounts[id]||0;const on=track===id;
              return(
                <button key={id} onClick={()=>setTrack(id)} style={{
                  padding:"4px 12px",borderRadius:99,border:"none",
                  background:on?RED:"transparent",
                  color:on?"#FFF":"#4B5563",
                  fontSize:12.5,fontWeight:on?600:400,whiteSpace:"nowrap",
                  transition:"all .15s",flexShrink:0}}>
                  {t.tracks[i]}
                  {feed&&cnt>0&&(
                    <span style={{marginLeft:4,opacity:.55,fontSize:11}}>({cnt})</span>
                  )}
                </button>
              );
            })}
          </div>
        </div>
      </header>

      {/* ── FILTER BAR: roles + period ── */}
      <div style={{background:"#FFF",borderBottom:"1px solid #E5E7EB"}}>
        <div style={{maxWidth:1360,margin:"0 auto",padding:"0 14px",
          display:"flex",alignItems:"center",minHeight:38,gap:6,
          overflowX:"auto",scrollbarWidth:"none",flexWrap:"wrap",paddingTop:4,paddingBottom:4}}>

          {/* roles */}
          <span style={{fontSize:10,color:"#9CA3AF",fontWeight:600,
            textTransform:"uppercase",letterSpacing:"1.2px",flexShrink:0}}>
            {t.roles_lbl}
          </span>
          {[null,...Object.keys(AUD)].map(r=>{
            const a=r?AUD[r]:null;const on=audFilter===r;
            return(
              <button key={r||"all"} onClick={()=>setAudFilter(r)} style={{
                background:on?(a?a.b:"rgba(0,0,0,.06)"):"transparent",
                border:`1px solid ${on?(a?a.c+"55":"rgba(0,0,0,.15)"):"#E5E7EB"}`,
                borderRadius:99,padding:"3px 11px",flexShrink:0,
                color:on?(a?a.c:"#111"):"#6B7280",
                fontSize:11.5,fontWeight:on?700:400,transition:"all .15s"}}>
                {r?a.l:t.all_roles}
              </button>
            );
          })}

          {/* separator */}
          <div style={{width:1,height:16,background:"#E5E7EB",flexShrink:0,margin:"0 4px"}}/>

          {/* period */}
          <span style={{fontSize:10,color:"#9CA3AF",fontWeight:600,
            textTransform:"uppercase",letterSpacing:"1.2px",flexShrink:0}}>
            Período
          </span>
          {[{v:null,l:"Todos"},{v:7,l:"7d"},{v:30,l:"30d"},{v:90,l:"3m"}].map(p=>{
            const on=period===p.v;
            return(
              <button key={String(p.v)} onClick={()=>setPeriod(p.v)} style={{
                background:on?"#1F2937":"transparent",
                border:`1px solid ${on?"#1F2937":"#E5E7EB"}`,
                borderRadius:99,padding:"3px 11px",flexShrink:0,
                color:on?"#FFF":"#6B7280",
                fontSize:11.5,fontWeight:on?700:400,transition:"all .15s"}}>
                {p.l}
              </button>
            );
          })}
        </div>
      </div>

      {/* ── BANNER ── */}
      <div style={{background:"#FFF",borderBottom:"1px solid #EBEBEB",
        padding:"14px 28px",textAlign:"center"}}>
        <p style={{fontSize:14,fontWeight:300,color:"#374151",lineHeight:1.6}}>
          RSS + Gemini · {t.automatic} ·{" "}
          <strong style={{color:RED,fontWeight:600}}>6h BRT</strong>
          {lang!=="pt"&&(
            <span style={{marginLeft:12,fontSize:11.5,color:"#9CA3AF",
              background:"#F3F4F6",padding:"2px 8px",borderRadius:99}}>
              ℹ️ {t.content_note}
            </span>
          )}
        </p>
      </div>

      {/* ── MAIN ── */}
      <main style={{maxWidth:1360,margin:"0 auto",padding:"32px 28px 60px"}}>

        {loading&&(
          <div style={{textAlign:"center",padding:"80px 0"}}>
            <div style={{width:36,height:36,border:"3px solid #E5E7EB",
              borderTopColor:RED,borderRadius:"50%",
              animation:"spin .8s linear infinite",margin:"0 auto 16px"}}/>
            <p style={{color:"#9CA3AF",fontSize:14}}>Carregando feed…</p>
          </div>
        )}

        {error&&(
          <div style={{textAlign:"center",padding:"80px 0"}}>
            <p style={{fontSize:36,marginBottom:12}}>⚠️</p>
            <p style={{fontSize:14,color:"#6B7280",marginBottom:8}}>
              Feed não encontrado.
            </p>
            <p style={{fontSize:12,color:"#9CA3AF"}}>{error}</p>
          </div>
        )}

        {!loading&&!error&&(
          <>
            {featured&&track==="all"&&!search&&!audFilter&&(
              <div style={{marginBottom:40}}>
                <Featured item={featured} lang={lang} t={t}/>
              </div>
            )}

            {track==="all"&&!search&&!audFilter&&(
              <div style={{display:"flex",justifyContent:"space-between",
                alignItems:"center",marginBottom:24,paddingBottom:12,
                borderBottom:"2px solid #E5E7EB",borderLeft:`4px solid ${RED}`,paddingLeft:12}}>
                <h2 style={{fontSize:20,fontWeight:700,color:"#111"}}>
                  {t.latest}
                </h2>
                <span style={{fontSize:12.5,color:RED,fontWeight:600}}>
                  {items.length} {t.insights}
                </span>
              </div>
            )}

            {visible.map(s=>(
              <Section key={s.id} title={s.label} items={s.items}
                lang={lang} t={t} variant={s.variant}/>
            ))}

            {/* Technology Radar */}
            {feed?.radar&&(track==="all"||track==="arch")&&!search&&(
              <TechRadar radarData={feed.radar} t={t}/>
            )}

            {/* Stocks section */}
            {feed?.stocks&&(track==="all"||track==="agnostic")&&!search&&(
              <StocksSection stocks={feed.stocks} t={t} lang={lang}/>
            )}

            {visible.length===0&&!feed?.radar&&(
              <div style={{textAlign:"center",padding:"60px 0"}}>
                <p style={{fontSize:40,marginBottom:12}}>🔍</p>
                <p style={{fontSize:14,color:"#9CA3AF"}}>
                  {search?`"${search}" — sem resultados`:
                    audFilter?`Nenhum item para ${AUD[audFilter]?.l}`:"Nenhum item."}
                </p>
              </div>
            )}
          </>
        )}
      </main>

      {/* ── SOURCE STRIP ── */}
      {!loading&&!error&&(
        <div style={{borderTop:"1px solid #E5E7EB",background:"#FFF",padding:"24px 28px 28px"}}>
          <div style={{maxWidth:1360,margin:"0 auto"}}>
            <p style={{fontSize:10,color:"#9CA3AF",marginBottom:16,fontWeight:600,
              textTransform:"uppercase",letterSpacing:"1.5px"}}>{t.sources_title}</p>
            <div className="hscroll" style={{gap:22}}>
              {[
                {l:"Salesforce",c:"#0369A1",b:"#DBEAFE"},{l:"Anthropic",c:"#92400E",b:"#FEF3C7"},
                {l:"OpenAI",c:"#047857",b:"#D1FAE5"},{l:"Google AI",c:"#1D4ED8",b:"#DBEAFE"},
                {l:"AWS",c:"#9A3412",b:"#FEE2E2"},{l:"VentureBeat",c:"#5B21B6",b:"#EDE9FE"},
                {l:"TechCrunch",c:"#0E7490",b:"#CFFAFE"},{l:"MCP.io",c:"#9D174D",b:"#FCE7F3"},
                {l:"LangChain",c:"#047857",b:"#D1FAE5"},{l:"Langfuse",c:"#0E7490",b:"#CFFAFE"},
                {l:"Reddit r/SF",c:"#C2410C",b:"#FEF3C7"},{l:"Hacker News",c:"#B45309",b:"#FEF3C7"},
                {l:"Dev.to",c:"#1F2937",b:"#F3F4F6"},{l:"InfoWorld",c:"#374151",b:"#F3F4F6"},
              ].map(s=>(
                <div key={s.l} style={{display:"flex",flexDirection:"column",
                  alignItems:"center",gap:6,flexShrink:0}}>
                  <div style={{width:48,height:48,borderRadius:"50%",
                    background:s.b,color:s.c,fontSize:11,fontWeight:800,
                    display:"flex",alignItems:"center",justifyContent:"center",
                    border:`2px solid ${s.c}22`,boxShadow:`0 2px 8px ${s.c}16`,
                    letterSpacing:"-0.5px"}}>
                    {s.l.slice(0,2).toUpperCase()}
                  </div>
                  <span style={{fontSize:9.5,color:"#9CA3AF",whiteSpace:"nowrap"}}>{s.l}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      )}

      {/* ── FOOTER ── */}
      <footer style={{borderTop:"1px solid #E5E7EB",padding:"16px 28px",
        textAlign:"center",background:"#FAFAFA"}}>
        <p style={{fontSize:11,color:"#D1D5DB"}}>
          RSS · Gemini 1.5 Flash · Google Apps Script · 6h BRT
        </p>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
