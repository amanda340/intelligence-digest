fabric:{u:"Jun/2026",d:[
  {t:"Agent Fabric: control plane multi-vendor para governar o 'agent sprawl'",
   s:"Lançado set/2025, expandido TDX abr/2026. Quatro pilares: Agent Registry (catálogo central de todos os agentes e tools, incluindo MCP e A2A servers), Agent Broker (roteamento inteligente), Agent Governance (permissões e data access) e Agent Visualizer (insights em tempo real). Empresas como Capita, Alcon e Rush University já orquestram centenas de agentes multi-plataforma.",
   d:"Posicione Agent Fabric como resposta ao 'agent sprawl' — o problema real de empresas que acumularam agentes de múltiplos vendors sem governança central. É o argumento que justifica consolidar no stack Salesforce/MuleSoft.",
   f:"Salesforce / MuleSoft Docs",dt:"Set/2025",tag:"Agent Fabric",alert:false,

   d:"Use guided determinism como argumento de maturidade com clientes: autonomia calibrada é mais vendável que autonomia total em enterprise. Documenta a decisão do FinDiagAgent — Router + Agent Script substitui os 7 subagentes hardcoded.",

  {t:"MCP Bridge: qualquer API existente vira tool de agente sem código",

   d:"MCP Bridge muda o argumento de entrada para projetos Agentforce: qualquer API legada já existente pode ser exposta como tool de agente hoje — reduz drasticamente o escopo de integração e o tempo até valor.",

  {t:"Ranking de frameworks agnósticos 2026: LangGraph #1, Claude SDK #2, CrewAI #3",
   s:"Baseado em 18+ deploys de produção (Alice Labs): LangGraph lidera para workflows stateful complexos com branching, retries e human-in-the-loop. Claude Agent SDK #2 — a mesma arquitetura que roda Claude Code, melhor para agentes Anthropic-nativos com MCP, skills e subagentes. CrewAI #3 para protótipos role-based rápidos. Pydantic AI ganhou tração para type safety (8/10 DX vs LangChain 5/10).",

  {t:"Google A2A v1.0 nativo em LangGraph, CrewAI, AutoGen e Semantic Kernel",

   d:"A2A é agora padrão multi-framework de fato — não é só protocolo do Google. Qualquer stack que usa LangGraph ou CrewAI tem A2A. Isso reforça a interoperabilidade do Agent Fabric e o argumento MCP/A2A como padrão aberto.",

  {t:"AWS lança Strands Agents — framework model-driven nativo no Bedrock",

   d:"Strands + Bedrock é o stack agnóstico de referência para builds do lado da infra. Conheça para a conversa técnica em contas AWS-native — e para avaliar quando o Agent Fabric do Salesforce é mais adequado que um build custom.",

   d:"Use esse número como filtro em discovery: antes de propor multi-agente, valide se a complexidade justifica. Multi-agente mal justificado gera retrabalho e desconfiança — é o erro mais comum em projetos Agentforce.",

  {t:"BMS, Snowflake e parceiros: Anthropic avança no control plane enterprise",
   s:"Bristol Myers Squibb padroniza Claude Enterprise para 30k funcionários (drug discovery). VentureBeat rastreia: Microsoft lidera em orquestração enterprise (38%), OpenAI cresce (25,7%), Anthropic registra primeiro foothold mensurável. A disputa não é pelo melhor modelo — é por quem controla onde o agente roda e quão difícil é sair.",

   d:"Monitore Kore.ai em contas Azure-first que ainda não têm Salesforce. A ABL pode influenciar standards de definição de agentes — assim como Terraform influenciou infra-as-code.",

function AudBadge({r}){const a=AUD[r];return(
  <span style={{background:a.b,color:a.c,border:`1px solid ${a.c}50`,borderRadius:999,padding:"2px 9px",fontSize:10,fontWeight:600,whiteSpace:"nowrap",letterSpacing:"0.03em"}}>{a.l}</span>
);}

function Card({item}){
  const [open,setOpen]=useState(false);
  const c=TC[item.tag]||"#6B7280";
  return(
    <div onClick={()=>setOpen(v=>!v)} style={{
      background:"#0F1A2E",
      border:`1px solid ${item.alert?"rgba(251,191,36,.35)":"#1E293B"}`,
      borderLeft:`3px solid ${item.alert?"#FBBF24":c}`,
      borderRadius:8,padding:"16px",cursor:"pointer",marginBottom:10,
      transition:"border-color .15s,box-shadow .15s",
      animation:item.alert?"alertglow 2.5s ease-in-out infinite":"none",
    }}
    onMouseEnter={e=>{e.currentTarget.style.borderColor=item.alert?"rgba(251,191,36,.6)":`${c}60`;e.currentTarget.style.boxShadow=`0 4px 20px ${c}18`;}}
    onMouseLeave={e=>{e.currentTarget.style.borderColor=item.alert?"rgba(251,191,36,.35)":"#1E293B";e.currentTarget.style.boxShadow="";}}>
      <div style={{display:"flex",gap:10,alignItems:"flex-start",marginBottom:8}}>
        <div style={{flex:1}}>
          {item.alert&&<span style={{background:"rgba(251,191,36,.12)",color:"#FBBF24",border:"1px solid rgba(251,191,36,.35)",borderRadius:999,padding:"2px 9px",fontSize:10,fontWeight:700,marginBottom:6,display:"inline-block",letterSpacing:"0.04em"}}>⚡ ALERTA</span>}
          <h3 className="serif" style={{margin:"2px 0 0",fontSize:15,fontWeight:700,color:"#EEF2FF",lineHeight:1.4}}>{item.t}</h3>
        </div>
        <span style={{background:c+"15",color:c,border:`1px solid ${c}35`,borderRadius:999,padding:"2px 10px",fontSize:10,fontWeight:600,whiteSpace:"nowrap",flexShrink:0,letterSpacing:"0.04em"}}>{item.tag}</span>
      </div>
      <div style={{display:"flex",gap:5,flexWrap:"wrap",marginBottom:10}}>
        {item.aud.map(r=><AudBadge key={r} r={r}/>)}
      </div>
      <p style={{margin:"0 0 10px",fontSize:13,color:"#94A3B8",lineHeight:1.65}}>{item.s}</p>
      {open&&(
        <div style={{background:"rgba(167,139,250,.06)",border:"1px solid rgba(167,139,250,.2)",borderRadius:6,padding:"10px 13px",marginBottom:10}}>
          <p style={{margin:0,fontSize:12.5,color:"#C4B5FD",lineHeight:1.6}}>
            <strong style={{color:"#A78BFA",fontFamily:"'Playfair Display',serif"}}>🏛 Decisão arquitetural — </strong>{item.d}
          </p>
        </div>
      )}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:6,paddingTop:6,borderTop:"1px solid #1E293B"}}>
        <span style={{fontSize:11,color:"#475569"}}>📰 {item.f} · {item.dt}</span>
        <div style={{display:"flex",gap:10,alignItems:"center"}}>
          {item.url&&<a href={item.url} target="_blank" rel="noopener noreferrer" onClick={e=>e.stopPropagation()} style={{fontSize:11,color:"#38BDF8",textDecoration:"none"}}>fonte ↗</a>}
          <span style={{fontSize:11,color:"#A78BFA"}}>{open?"▲ fechar":"▼ decisão"}</span>
        </div>
      </div>
    </div>
  );
}

function App(){
  const [tid,setTid]=useState("hot");
  const [aud,setAud]=useState(null);
  const tr=TRACKS.find(t=>t.id===tid);
  const data=N[tid];
  const items=useMemo(()=>aud?data.d.filter(i=>i.aud.includes(aud)):data.d,[tid,aud]);
  const totalAlerts=useMemo(()=>Object.values(N).reduce((s,t)=>s+t.d.filter(i=>i.alert).length,0),[]);
  const totalItems=useMemo(()=>Object.values(N).reduce((s,t)=>s+t.d.length,0),[]);

  return(
    <div style={{minHeight:"100vh",paddingBottom:48}}>
      <div style={{background:"rgba(2,8,23,.96)",borderBottom:"1px solid #1E293B",padding:"14px 16px 12px",position:"sticky",top:0,zIndex:10,backdropFilter:"blur(20px)"}}>
        <div style={{maxWidth:920,margin:"0 auto"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:12}}>
            <div>
              <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:4}}>
                <span style={{width:7,height:7,borderRadius:"50%",background:"#EF4444",boxShadow:"0 0 8px #EF4444",display:"inline-block",animation:"pulse 2s infinite"}}/>
                <span style={{fontSize:10,color:"#38BDF8",fontWeight:700,letterSpacing:"2px",textTransform:"uppercase"}}>AO VIVO · SALESFORCE & IA</span>
              </div>
              <h1 className="serif" style={{margin:0,fontSize:24,fontWeight:700,color:"#EEF2FF",letterSpacing:"-0.01em",lineHeight:1.2}}>Intelligence Digest</h1>
              <p style={{margin:"4px 0 0",fontSize:11,color:"#475569"}}>Bússola para Arquitetos de IA · curadoria proativa · Jun 2026</p>
            </div>
            <div style={{textAlign:"right",flexShrink:0,paddingTop:2}}>
              <div style={{fontSize:10.5,color:"#475569",marginBottom:5}}>{new Date().toLocaleDateString("pt-BR",{weekday:"short",day:"2-digit",month:"short",year:"numeric"})}</div>
              <div style={{background:"rgba(251,191,36,.1)",border:"1px solid rgba(251,191,36,.3)",borderRadius:999,padding:"3px 10px",fontSize:10.5,color:"#FBBF24",fontWeight:700,display:"inline-block"}}>⚡ {totalAlerts} alertas · {totalItems} insights</div>
            </div>
          </div>
          <div style={{display:"flex",flexWrap:"wrap",gap:5,marginBottom:9}}>
            {TRACKS.map(t=>{
              const on=tid===t.id;
              const cnt=N[t.id]?.d.length||0;
              const al=N[t.id]?.d.filter(i=>i.alert).length||0;
              return(
                <button key={t.id} onClick={()=>{setTid(t.id);setAud(null);}} style={{
                  background:on?`linear-gradient(135deg,${t.color},${t.color}99)`:t.color+"12",
                  border:`1px solid ${on?t.color:al>0?"rgba(251,191,36,.4)":t.color+"35"}`,
                  borderRadius:18,padding:"6px 12px",color:on?"#fff":t.color,
                  fontSize:11.5,fontWeight:on?700:500,cursor:"pointer",
                  display:"flex",alignItems:"center",gap:5,transition:"all .15s",
                  boxShadow:on?`0 3px 12px ${t.color}40`:"none",position:"relative",
                }}>
                  {t.label}
                  <span style={{fontSize:9,background:on?"rgba(255,255,255,.22)":t.color+"22",borderRadius:10,padding:"1px 6px",fontWeight:700,color:on?"#fff":t.color}}>{cnt}</span>
                  {al>0&&!on&&<span style={{position:"absolute",top:-4,right:-4,width:14,height:14,borderRadius:"50%",background:"#FBBF24",color:"#000",fontSize:8,fontWeight:900,display:"flex",alignItems:"center",justifyContent:"center",boxShadow:"0 0 6px #FBBF24"}}>!</span>}
                </button>
              );
            })}
          </div>
          <div style={{display:"flex",gap:5,alignItems:"center"}}>
            <span style={{fontSize:10,color:"#475569",marginRight:2,fontWeight:500}}>Audiência:</span>
            {[null,"SE","TA","Build","Exec"].map(r=>{
              const a=r?AUD[r]:null;const on=aud===r;
              return(
                <button key={r||"all"} onClick={()=>setAud(r)} style={{
                  background:on?(a?a.b:"rgba(238,242,255,.08)"):"transparent",
                  border:`1px solid ${on?(a?a.c:"rgba(238,242,255,.25)"):"#1E293B"}`,
                  borderRadius:999,padding:"3px 11px",
                  color:on?(a?a.c:"#EEF2FF"):"#475569",
                  fontSize:11,fontWeight:on?700:400,cursor:"pointer",transition:"all .15s",
                }}>{r?a.l:"Todos"}</button>
              );
            })}
          </div>
        </div>
      </div>
      <div style={{maxWidth:920,margin:"0 auto",padding:"18px 16px 0"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14,paddingBottom:12,borderBottom:"1px solid #1E293B"}}>
          <div>
            <h2 className="serif" style={{margin:0,fontSize:20,fontWeight:700,color:"#EEF2FF",lineHeight:1.2}}>{tr.label}</h2>
            <p style={{margin:"4px 0 0",fontSize:11,color:"#475569"}}>{items.length} insight{items.length!==1?"s":""} · curadoria {data.u}{aud?` · ${AUD[aud].l}`:""}</p>
          </div>
          <span style={{background:tr.color+"12",border:`1px solid ${tr.color}30`,borderRadius:999,padding:"3px 12px",fontSize:10,color:tr.color,fontWeight:700,letterSpacing:"0.04em"}}>✓ curado</span>
        </div>
        {items.length===0?(
          <div style={{textAlign:"center",padding:"40px",color:"#334155"}}>
            <div style={{fontSize:36,marginBottom:10}}>🔍</div>
            <p style={{fontSize:13}}>Nenhum item para <strong style={{color:AUD[aud]?.c}}>{AUD[aud]?.l}</strong> nesta trilha.</p>
          </div>
        ):items.map((item,i)=><Card key={i} item={item}/>)}
        <p style={{textAlign:"center",marginTop:16,fontSize:11,color:"#334155",lineHeight:1.8}}>
          Clique em cada card para ver a decisão arquitetural ↑<br/>
          <span style={{color:"#2D3E55"}}>Fontes: inglês + PT · curadoria proativa · últimas 8 semanas · Jun/2026</span>
        </p>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
