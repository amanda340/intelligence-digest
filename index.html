/* ─── NAV ICONS ─── */
const IconFeed=()=><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>;
const IconSaved=()=><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>;
const IconArch=()=><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>;
const IconProfile=()=><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>;
const IconChevron=({open})=><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" style={{transition:"transform .2s",transform:open?"rotate(180deg)":"rotate(0deg)"}}><polyline points="6 9 12 15 18 9"/></svg>;
const IconLink=()=><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>;

/* ─── BADGE ─── */
function AudBadge({r}){
  const a=AUD[r];
  return <span className="aud-pill" style={{background:a.b,color:a.c,border:`1px solid ${a.c}40`}}>{a.l}</span>;
}

/* ─── CARD ─── */
function Card({item}){
  const [open,setOpen]=useState(false);
  const c=TC[item.tag]||"#6B7280";
  return(
    <article className="card" onClick={()=>setOpen(v=>!v)} style={{
      background:"#0F1A2E",
      border:`1px solid ${item.alert?"rgba(251,191,36,.3)":"#1E293B"}`,
      borderRadius:12,
      overflow:"hidden",
      cursor:"pointer",
      animation:item.alert?"alertglow 2.8s ease-in-out infinite":"none",
      position:"relative",
    }}>
      {/* left accent bar */}
      <div style={{position:"absolute",left:0,top:0,bottom:0,width:3,background:item.alert?"#FBBF24":c,borderRadius:"12px 0 0 12px"}}/>

      <div style={{padding:"14px 14px 14px 18px"}}>
        {/* top row: alert + tag */}
        <div style={{display:"flex",gap:7,alignItems:"center",marginBottom:9,flexWrap:"wrap"}}>
          {item.alert&&(
            <span className="tag-chip" style={{background:"rgba(251,191,36,.12)",color:"#FBBF24",border:"1px solid rgba(251,191,36,.3)"}}>⚡ URGENTE</span>
          )}
          <span className="tag-chip" style={{background:c+"14",color:c,border:`1px solid ${c}30`}}>{item.tag}</span>
          <div style={{flex:1}}/>
          <div style={{display:"flex",gap:4,flexWrap:"wrap"}}>
            {item.aud.map(r=><AudBadge key={r} r={r}/>)}
          </div>
        </div>

        {/* headline */}
        <h3 className="serif" style={{fontSize:15,fontWeight:700,color:"#EEF2FF",lineHeight:1.38,margin:"0 0 8px",letterSpacing:"-0.01em"}}>{item.t}</h3>

        {/* summary */}
        <p style={{fontSize:13,color:"#94A3B8",lineHeight:1.65,margin:"0 0 10px"}}>{item.s}</p>

        {/* decisão expandida */}
        {open&&(
          <div style={{background:"rgba(167,139,250,.07)",border:"1px solid rgba(167,139,250,.2)",borderRadius:8,padding:"11px 13px",margin:"0 0 10px"}}>
            <p style={{margin:0,fontSize:12.5,color:"#C4B5FD",lineHeight:1.62}}>
              <span className="serif" style={{color:"#A78BFA",fontWeight:700,fontSize:13}}>🏛 Decisão — </span>{item.d}
            </p>
          </div>
        )}

        {/* footer */}
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",paddingTop:9,borderTop:"1px solid #1A2840",flexWrap:"wrap",gap:6}}>
          <span style={{fontSize:11,color:"#334155",lineHeight:1.4}}>{item.f}<br/><span style={{color:"#2D3E55"}}>{item.dt}</span></span>
          <div style={{display:"flex",gap:10,alignItems:"center"}}>
            {item.url&&(
              <a href={item.url} target="_blank" rel="noopener noreferrer"
                 onClick={e=>e.stopPropagation()}
                 style={{display:"flex",alignItems:"center",gap:4,fontSize:11,color:"#38BDF8",textDecoration:"none",padding:"4px 8px",border:"1px solid rgba(56,189,248,.25)",borderRadius:6}}>
                fonte <IconLink/>
              </a>
            )}
            <span style={{display:"flex",alignItems:"center",gap:4,fontSize:11,color:"#A78BFA"}}>
              {open?"fechar":"decisão"} <IconChevron open={open}/>
            </span>
          </div>
        </div>
      </div>
    </article>
  );
}

/* ─── APP ─── */
function App(){
  const [tid,setTid]=useState("hot");
  const [aud,setAud]=useState(null);
  const [navTab,setNavTab]=useState("feed");
  const tr=TRACKS.find(t=>t.id===tid);
  const data=N[tid];
  const items=useMemo(()=>aud?data.d.filter(i=>i.aud.includes(aud)):data.d,[tid,aud]);
  const totalAlerts=useMemo(()=>Object.values(N).reduce((s,t)=>s+t.d.filter(i=>i.alert).length,0),[]);
  const totalItems=useMemo(()=>Object.values(N).reduce((s,t)=>s+t.d.length,0),[]);

  return(
    <div style={{display:"flex",flexDirection:"column",height:"100%",background:"#081327"}}>

      {/* ── HEADER ── */}
      <header style={{background:"rgba(5,14,33,.97)",borderBottom:"1px solid #1A2840",padding:"14px 16px 0",flexShrink:0,backdropFilter:"blur(20px)",position:"sticky",top:0,zIndex:20}}>
        {/* title row */}
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:14}}>
          <div>
            <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:4}}>
              <span style={{width:6,height:6,borderRadius:"50%",background:"#EF4444",boxShadow:"0 0 8px #EF444488",display:"inline-block",animation:"livepulse 2s infinite"}}/>
              <span style={{fontSize:10,color:"#38BDF8",fontWeight:700,letterSpacing:"2.5px",textTransform:"uppercase"}}>AO VIVO</span>
            </div>
            <h1 className="serif" style={{fontSize:22,fontWeight:700,color:"#EEF2FF",letterSpacing:"-0.02em",lineHeight:1}}>Intelligence Digest</h1>
            <p style={{marginTop:4,fontSize:10.5,color:"#475569",fontWeight:400}}>Bússola para Arquitetos de IA · Jun 2026</p>
          </div>
          <div style={{background:"rgba(251,191,36,.1)",border:"1px solid rgba(251,191,36,.25)",borderRadius:999,padding:"5px 11px",textAlign:"center",flexShrink:0,marginTop:2}}>
            <div style={{fontSize:13,fontWeight:700,color:"#FBBF24",lineHeight:1}}>⚡ {totalAlerts}</div>
            <div style={{fontSize:9,color:"rgba(251,191,36,.6)",marginTop:2,fontWeight:500}}>ALERTAS</div>
          </div>
        </div>

        {/* track chips */}
        <div className="scroll-x" style={{paddingBottom:1}}>
          {TRACKS.map(t=>{
            const on=tid===t.id;
            const al=N[t.id]?.d.filter(i=>i.alert).length||0;
            return(
              <button key={t.id} className="track-chip"
                onClick={()=>{setTid(t.id);setAud(null);}}
                style={{
                  background:on?t.color:"#0F1A2E",
                  color:on?"#020817":t.color,
                  border:`1px solid ${on?t.color:al>0?"rgba(251,191,36,.35)":t.color+"30"}`,
                  boxShadow:on?`0 2px 12px ${t.color}50`:"none",
                  position:"relative",
                }}>
                {t.label}
                {al>0&&!on&&<span style={{position:"absolute",top:-3,right:-3,width:13,height:13,borderRadius:"50%",background:"#FBBF24",fontSize:8,fontWeight:900,color:"#000",display:"flex",alignItems:"center",justifyContent:"center",boxShadow:"0 0 6px #FBBF24"}}>{al}</span>}
              </button>
            );
          })}
          <div style={{flexShrink:0,width:8}}/>
        </div>

        {/* audience filter */}
        <div style={{display:"flex",gap:5,alignItems:"center",padding:"10px 0 12px",overflowX:"auto",scrollbarWidth:"none"}}>
          <span style={{fontSize:10,color:"#334155",fontWeight:600,letterSpacing:"0.05em",textTransform:"uppercase",flexShrink:0,paddingLeft:2}}>Para</span>
          {[null,"SE","TA","Build","Exec"].map(r=>{
            const a=r?AUD[r]:null;const on=aud===r;
            return(
              <button key={r||"all"} onClick={()=>setAud(r)} style={{
                background:on?(a?a.b:"rgba(238,242,255,.1)"):"transparent",
                border:`1px solid ${on?(a?a.c:"rgba(238,242,255,.3)"):"#1E293B"}`,
                borderRadius:999,padding:"4px 12px",flexShrink:0,
                color:on?(a?a.c:"#EEF2FF"):"#334155",
                fontFamily:"inherit",fontSize:11,fontWeight:on?600:400,cursor:"pointer",transition:"all .15s",
              }}>{r?a.l:"Todos"}</button>
            );
          })}
        </div>
      </header>

      {/* ── FEED ── */}
      <main className="scroll-y" style={{flex:1,overflowY:"auto",padding:"16px 12px 0"}}>
        {/* section label */}
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12,paddingBottom:10,borderBottom:"1px solid #1A2840"}}>
          <div>
            <h2 className="serif" style={{fontSize:18,fontWeight:700,color:"#EEF2FF",lineHeight:1.2}}>{tr.label}</h2>
            <p style={{marginTop:3,fontSize:11,color:"#334155"}}>{items.length} insight{items.length!==1?"s":""} · {data.u}{aud?` · ${AUD[aud].l}`:""}</p>
          </div>
          <span style={{background:tr.color+"10",border:`1px solid ${tr.color}25`,borderRadius:999,padding:"4px 10px",fontSize:10,color:tr.color,fontWeight:600,letterSpacing:"0.05em",flexShrink:0}}>curado</span>
        </div>

        {/* cards */}
        <div style={{display:"flex",flexDirection:"column",gap:10}}>
          {items.length===0?(
            <div style={{textAlign:"center",padding:"48px 24px",color:"#1E293B"}}>
              <div style={{fontSize:40,marginBottom:12}}>🔍</div>
              <p style={{fontSize:13,color:"#334155"}}>Nenhum item para <strong style={{color:AUD[aud]?.c}}>{AUD[aud]?.l}</strong> nesta trilha.</p>
            </div>
          ):items.map((item,i)=><Card key={i} item={item}/>)}
        </div>

        <p style={{textAlign:"center",padding:"20px 0 8px",fontSize:10.5,color:"#1A2535",lineHeight:1.9}}>
          Toque para ver a decisão arquitetural<br/>
          <span style={{color:"#152030"}}>curadoria proativa · inglês + fontes globais · Jun 2026</span>
        </p>
      </main>

      {/* ── BOTTOM NAV ── */}
      <nav style={{background:"rgba(5,14,33,.97)",borderTop:"1px solid #1A2840",display:"flex",flexShrink:0,backdropFilter:"blur(20px)",paddingBottom:"env(safe-area-inset-bottom,0px)"}}>
        {[
          {id:"feed",    label:"Feed",        Icon:IconFeed},
          {id:"saved",   label:"Salvo",       Icon:IconSaved},
          {id:"arch",    label:"Arquitetura", Icon:IconArch},
          {id:"profile", label:"Perfil",      Icon:IconProfile},
        ].map(({id,label,Icon})=>(
          <button key={id} className={`nav-item${navTab===id?" active":""}`} onClick={()=>setNavTab(id)}>
            <Icon/>
            <span>{label}</span>
          </button>
        ))}
      </nav>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
