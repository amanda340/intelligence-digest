<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Intelligence Digest · Bússola para Arquitetos de IA</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#F5F5F5;font-family:'Inter',-apple-system,sans-serif;color:#1A1A1A}
::-webkit-scrollbar{height:3px;width:3px}
::-webkit-scrollbar-track{background:#F1F1F1}
::-webkit-scrollbar-thumb{background:#D1D5DB;border-radius:99px}
@keyframes spin{to{transform:rotate(360deg)}}
.serif{font-family:'Playfair Display',Georgia,serif}
.row{display:flex;gap:16px;overflow-x:auto;scrollbar-width:none;padding-bottom:6px}
.row::-webkit-scrollbar{display:none}
.lift{transition:transform .15s,box-shadow .15s;cursor:pointer}
.lift:hover{transform:translateY(-3px);box-shadow:0 12px 32px rgba(0,0,0,.10)}
a{text-decoration:none;color:inherit}
button{cursor:pointer;font-family:inherit}
@media(max-width:700px){
  .hero-wrap{flex-direction:column!important}
  .hero-img{min-height:180px!important;width:100%!important;flex:none!important}
}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useMemo}=React;
const RED="#D72638";
const FEED="./feed.json";

const TRACKS=[
  {id:"all",      label:"Todos"},
  {id:"hot",      label:"🔥 Urgente Agora"},
  {id:"summer26", label:"☁️ Summer '26"},
  {id:"fabric",   label:"🧵 Agent Fabric"},
  {id:"agnostic", label:"🌐 Mercado & IA"},
  {id:"rivals",   label:"⚔️ Concorrentes"},
  {id:"crossref", label:"🔀 Cross-Reference"},
  {id:"arch",     label:"🏛️ MCP / A2A"},
  {id:"tools",    label:"🛠️ LLMOps"},
  {id:"skills",   label:"🎓 Skills"},
];

const TC={
  Headless:{c:"#0369A1",bg:"#E0F2FE",e:"🔗"},
  FIFA:{c:"#0369A1",bg:"#DBEAFE",e:"⚽"},
  "Agent Fabric":{c:"#5B21B6",bg:"#EDE9FE",e:"🕸️"},
  "Multi-Agent":{c:"#6D28D9",bg:"#F3E8FF",e:"🤝"},
  "Agentforce Ops":{c:"#1D4ED8",bg:"#DBEAFE",e:"⚙️"},
  Momentum:{c:"#065F46",bg:"#D1FAE5",e:"📈"},
  AgentExchange:{c:"#5B21B6",bg:"#EDE9FE",e:"🛒"},
  "Summer 26":{c:"#075985",bg:"#E0F2FE",e:"☁️"},
  "Guided Det":{c:"#5B21B6",bg:"#EDE9FE",e:"🎯"},
  "MCP Bridge":{c:"#0E7490",bg:"#CFFAFE",e:"🔌"},
  "LLM Gov":{c:"#9D174D",bg:"#FCE7F3",e:"🏛"},
  "Claude SDK":{c:"#92400E",bg:"#FEF3C7",e:"🤖"},
  Google:{c:"#1E40AF",bg:"#DBEAFE",e:"🔍"},
  Frameworks:{c:"#6D28D9",bg:"#EDE9FE",e:"🧩"},
  Anthropic:{c:"#92400E",bg:"#FEF3C7",e:"🧬"},
  Microsoft:{c:"#1E40AF",bg:"#DBEAFE",e:"💼"},
  ServiceNow:{c:"#065F46",bg:"#D1FAE5",e:"🔧"},
  SAP:{c:"#92400E",bg:"#FEF3C7",e:"🏢"},
  OpenAI:{c:"#065F46",bg:"#D1FAE5",e:"✨"},
  "Build-vs-Buy":{c:"#9A3412",bg:"#FEE2E2",e:"⚖️"},
  "Decisão":{c:"#92400E",bg:"#FEF3C7",e:"🎲"},
  "Agent Wash":{c:"#991B1B",bg:"#FEE2E2",e:"⚠️"},
  MCP:{c:"#9D174D",bg:"#FCE7F3",e:"🔌"},
  "A2A":{c:"#5B21B6",bg:"#EDE9FE",e:"↔️"},
  WebMCP:{c:"#0E7490",bg:"#CFFAFE",e:"🌐"},
  Langfuse:{c:"#0E7490",bg:"#CFFAFE",e:"📊"},
  LLMOps:{c:"#1E40AF",bg:"#DBEAFE",e:"🛠️"},
  Skill:{c:"#065F46",bg:"#D1FAE5",e:"🎓"},
  Mercado:{c:"#9D174D",bg:"#FCE7F3",e:"📰"},
  Cert:{c:"#065F46",bg:"#D1FAE5",e:"🏅"},
};
const DEF_TC={c:"#374151",bg:"#F3F4F6",e:"🤖"};
const tc=(tag)=>TC[tag]||DEF_TC;

const SRCS=[
  {m:["salesforce","agentforce","vantagepoint","summer"],lbl:"SF", c:"#0369A1",bg:"#DBEAFE"},
  {m:["anthropic","claude"],                             lbl:"AN", c:"#92400E",bg:"#FEF3C7"},
  {m:["openai","gpt","codex"],                           lbl:"OA", c:"#065F46",bg:"#D1FAE5"},
  {m:["google","gemini","next web"],                     lbl:"G",  c:"#1E40AF",bg:"#DBEAFE"},
  {m:["aws","amazon","bedrock","strands"],                lbl:"AW", c:"#9A3412",bg:"#FEE2E2"},
  {m:["venturebeat"],                                    lbl:"VB", c:"#5B21B6",bg:"#EDE9FE"},
  {m:["techcrunch"],                                     lbl:"TC", c:"#0E7490",bg:"#CFFAFE"},
  {m:["microsoft","copilot"],                            lbl:"MS", c:"#1E40AF",bg:"#DBEAFE"},
  {m:["servicenow","now assist"],                        lbl:"SN", c:"#065F46",bg:"#D1FAE5"},
  {m:["sap","joule"],                                    lbl:"SAP",c:"#92400E",bg:"#FEF3C7"},
  {m:["langfuse","langchain","langgraph"],               lbl:"LG", c:"#0E7490",bg:"#CFFAFE"},
];
const DEF_SRC={lbl:"SRC",c:"#6B7280",bg:"#F3F4F6"};
function src(name){
  const n=(name||"").toLowerCase();
  return SRCS.find(s=>s.m.some(m=>n.includes(m)))||DEF_SRC;
}

function readTime(t){return Math.max(1,Math.round((t||"").split(" ").length/200))+" min leitura";}

function getItems(feed,id){
  if(!feed?.tracks) return [];
  const v=feed.tracks[id];
  if(!v) return [];
  return Array.isArray(v)?v:(v.d||[]);
}

function allItems(feed){
  if(!feed?.tracks) return [];
  return Object.entries(feed.tracks).flatMap(([t,v])=>
    (Array.isArray(v)?v:(v.d||[])).map(i=>({...i,_track:t}))
  );
}

/* ── Thumbnail ── */
function Thumb({tag,h=180,r="8px 8px 0 0",stretch=false}){
  const {c,bg,e}=tc(tag);
  return(
    <div style={{
      height:stretch?"100%":h,minHeight:stretch?220:h,
      borderRadius:r,background:bg,overflow:"hidden",position:"relative",
      display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,
    }}>
      <span style={{fontSize:stretch?64:h<160?28:40,zIndex:1,position:"relative"}}>{e}</span>
      <div style={{position:"absolute",right:-28,top:-28,width:120,height:120,borderRadius:"50%",background:c+"18"}}/>
      <div style={{position:"absolute",left:-18,bottom:-18,width:90,height:90,borderRadius:"50%",background:c+"12"}}/>
      <div style={{position:"absolute",bottom:0,left:0,right:0,height:48,
        background:`linear-gradient(to top,${bg}dd,transparent)`}}/>
    </div>
  );
}

/* ── Source circle ── */
function SrcCircle({name,size=20}){
  const s=src(name);
  return(
    <span style={{width:size,height:size,borderRadius:"50%",background:s.bg,color:s.c,
      fontSize:size*.38,fontWeight:800,display:"inline-flex",alignItems:"center",
      justifyContent:"center",flexShrink:0,border:`1.5px solid ${s.c}28`,letterSpacing:"-0.5px"}}>
      {s.lbl}
    </span>
  );
}

/* ── Tag pill ── */
function Pill({tag}){
  const {c,bg}=tc(tag);
  return(
    <span style={{background:bg,color:c,fontSize:11.5,fontWeight:600,
      padding:"2px 9px",borderRadius:99,border:`1px solid ${c}28`,whiteSpace:"nowrap"}}>
      {tag}
    </span>
  );
}

/* ── Featured hero card ── */
function Featured({item}){
  const [open,setOpen]=useState(false);
  return(
    <div className="lift hero-wrap"
      onClick={()=>setOpen(v=>!v)}
      style={{display:"flex",background:"#FFF",borderRadius:16,overflow:"hidden",
        border:"1px solid #E5E7EB"}}>

      {/* image */}
      <div className="hero-img" style={{flex:"0 0 44%",alignSelf:"stretch"}}>
        <Thumb tag={item.tag} stretch h={300} r="0"/>
      </div>

      {/* content */}
      <div style={{flex:1,padding:"32px 36px",display:"flex",flexDirection:"column",gap:16}}>
        <div style={{display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
          <SrcCircle name={item.f} size={24}/>
          <span style={{fontSize:13,color:"#374151",fontWeight:500}}>{item.f}</span>
          <span style={{color:"#D1D5DB"}}>·</span>
          <span style={{fontSize:13,color:"#9CA3AF"}}>{item.dt}</span>
          {item.alert&&(
            <span style={{marginLeft:"auto",background:"#FEF2F2",color:"#B91C1C",
              fontSize:11,fontWeight:700,padding:"3px 10px",borderRadius:99,
              border:"1px solid #FECACA",flexShrink:0}}>⚡ URGENTE</span>
          )}
        </div>

        <h2 className="serif" style={{fontSize:28,fontWeight:700,color:"#111",lineHeight:1.32}}>
          {item.t}
        </h2>

        <p style={{fontSize:15,color:"#4B5563",lineHeight:1.78}}>{item.s}</p>

        {open&&item.d&&(
          <div style={{background:"#F5F3FF",border:"1px solid #DDD6FE",borderRadius:10,padding:"14px 18px"}}>
            <p style={{margin:0,fontSize:13.5,color:"#5B21B6",lineHeight:1.65}}>
              <strong>🏛 Decisão arquitetural:</strong> {item.d}
            </p>
          </div>
        )}

        <div style={{display:"flex",alignItems:"center",gap:10,flexWrap:"wrap",marginTop:"auto",
          paddingTop:16,borderTop:"1px solid #F3F4F6"}}>
          <Pill tag={item.tag}/>
          <span style={{color:"#D1D5DB"}}>·</span>
          <span style={{color:"#9CA3AF",fontSize:13}}>{readTime(item.s)}</span>
          {item.d&&(
            <span style={{color:"#6D28D9",fontSize:13,fontWeight:500}}>
              {open?"▲ fechar":"▼ ver decisão"}
            </span>
          )}
          {item.url&&(
            <a href={item.url} target="_blank" rel="noopener"
               onClick={e=>e.stopPropagation()}
               style={{marginLeft:"auto",color:RED,fontSize:13,fontWeight:600}}>
              Fonte →
            </a>
          )}
        </div>
      </div>
    </div>
  );
}

/* ── News card ── */
function Card({item}){
  const [open,setOpen]=useState(false);
  return(
    <div className="lift"
      onClick={()=>setOpen(v=>!v)}
      style={{background:"#FFF",borderRadius:12,overflow:"hidden",border:"1px solid #E5E7EB",
        flex:"0 0 258px",display:"flex",flexDirection:"column"}}>

      <Thumb tag={item.tag} h={160}/>

      <div style={{padding:"14px 15px 15px",flex:1,display:"flex",flexDirection:"column",gap:8}}>
        <div style={{display:"flex",alignItems:"center",gap:6}}>
          <SrcCircle name={item.f} size={18}/>
          <span style={{fontSize:11.5,color:"#9CA3AF",flex:1,overflow:"hidden",
            textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{item.f}</span>
          {item.alert&&<span style={{fontSize:13,flexShrink:0}}>⚡</span>}
        </div>

        <h3 style={{fontSize:14.5,fontWeight:700,color:"#111",lineHeight:1.4,
          display:"-webkit-box",WebkitLineClamp:3,WebkitBoxOrient:"vertical",overflow:"hidden"}}>
          {item.t}
        </h3>

        <p style={{fontSize:12.5,color:"#6B7280",lineHeight:1.65,flex:1,
          display:"-webkit-box",WebkitLineClamp:open?20:2,WebkitBoxOrient:"vertical",overflow:"hidden"}}>
          {item.s}
        </p>

        {open&&item.d&&(
          <div style={{background:"#F5F3FF",border:"1px solid #DDD6FE",borderRadius:8,padding:"9px 12px"}}>
            <p style={{margin:0,fontSize:11.5,color:"#5B21B6",lineHeight:1.6}}>
              <strong>🏛</strong> {item.d}
            </p>
          </div>
        )}

        <div style={{display:"flex",alignItems:"center",gap:7,paddingTop:10,
          borderTop:"1px solid #F3F4F6",flexWrap:"wrap",marginTop:"auto"}}>
          <Pill tag={item.tag}/>
          <span style={{color:"#D1D5DB",fontSize:12}}>·</span>
          <span style={{color:"#9CA3AF",fontSize:12}}>{readTime(item.s)}</span>
          {item.url&&(
            <a href={item.url} target="_blank" rel="noopener"
               onClick={e=>e.stopPropagation()}
               style={{marginLeft:"auto",color:RED,fontSize:12,fontWeight:600}}>↗</a>
          )}
        </div>
      </div>
    </div>
  );
}

/* ── Section row ── */
function Section({title,items}){
  if(!items||items.length===0) return null;
  return(
    <section style={{marginBottom:44}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",
        marginBottom:16,paddingBottom:12,borderBottom:"2px solid #F0F0F0"}}>
        <h2 style={{fontSize:20,fontWeight:700,color:"#111"}}>{title}</h2>
        <span style={{fontSize:13,color:RED,fontWeight:600,flexShrink:0}}>
          {items.length} insight{items.length!==1?"s":""}
        </span>
      </div>
      <div className="row">
        {items.map((item,i)=><Card key={i} item={item}/>)}
        <div style={{flexShrink:0,width:4}}/>
      </div>
    </section>
  );
}

/* ── App ── */
function App(){
  const [feed,setFeed]=useState(null);
  const [loading,setLoading]=useState(true);
  const [error,setError]=useState(null);
  const [track,setTrack]=useState("all");
  const [search,setSearch]=useState("");

  useEffect(()=>{
    fetch(FEED+"?t="+Date.now())
      .then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.json();})
      .then(d=>{setFeed(d);setLoading(false);})
      .catch(e=>{setError(e.message);setLoading(false);});
  },[]);

  const items=useMemo(()=>allItems(feed),[feed]);
  const featured=useMemo(()=>items.find(i=>i.alert)||items[0],[items]);
  const alertCount=useMemo(()=>items.filter(i=>i.alert).length,[items]);

  const sections=useMemo(()=>{
    if(!feed) return [];
    return TRACKS.filter(t=>t.id!=="all").map(t=>{
      let list=getItems(feed,t.id);
      if(search.trim()){
        const q=search.toLowerCase();
        list=list.filter(i=>(i.t+i.s+(i.tag||"")+(i.f||"")).toLowerCase().includes(q));
      }
      return{...t,items:list};
    }).filter(s=>s.items.length>0);
  },[feed,search]);

  const visible=useMemo(()=>
    track==="all"?sections:sections.filter(s=>s.id===track)
  ,[sections,track]);

  const genAt=feed?.generatedAt
    ?new Date(feed.generatedAt).toLocaleDateString("pt-BR",{day:"2-digit",month:"long",year:"numeric"})
    :"";

  return(
    <div style={{background:"#F5F5F5",minHeight:"100vh"}}>

      {/* ── HEADER ── */}
      <header style={{background:"#FFF",borderBottom:"1px solid #EBEBEB",
        position:"sticky",top:0,zIndex:30,boxShadow:"0 1px 3px rgba(0,0,0,.04)"}}>
        <div style={{maxWidth:1240,margin:"0 auto",padding:"0 24px"}}>

          {/* brand strip */}
          <div style={{display:"flex",alignItems:"center",gap:20,height:58,
            borderBottom:"1px solid #F3F4F6",flexWrap:"wrap"}}>
            <span className="serif" style={{fontSize:22,fontWeight:800,color:RED,
              letterSpacing:"-0.5px",flexShrink:0,lineHeight:1}}>
              Intelligence Digest
            </span>
            <div style={{width:1,height:20,background:"#E5E7EB",flexShrink:0}}/>
            <div style={{flex:1}}/>
            <input type="search" placeholder="Buscar insights..." value={search}
              onChange={e=>setSearch(e.target.value)}
              style={{padding:"7px 14px",borderRadius:99,border:"1px solid #E5E7EB",
                background:"#F9FAFB",color:"#111",fontFamily:"inherit",fontSize:13,
                width:190,outline:"none"}}/>
            {alertCount>0&&(
              <span style={{background:"#FEF2F2",color:RED,fontSize:12,fontWeight:700,
                padding:"5px 12px",borderRadius:99,border:`1px solid ${RED}28`,flexShrink:0}}>
                ⚡ {alertCount} alertas
              </span>
            )}
            {genAt&&<span style={{fontSize:11,color:"#9CA3AF",flexShrink:0}}>{genAt}</span>}
          </div>

          {/* track nav */}
          <div className="row" style={{height:46,alignItems:"center",gap:2,padding:"0 0"}}>
            {TRACKS.map(t=>{
              const cnt=t.id==="all"?items.length:getItems(feed,t.id).length;
              const on=track===t.id;
              return(
                <button key={t.id} onClick={()=>setTrack(t.id)}
                  style={{padding:"5px 13px",borderRadius:99,border:"none",
                    background:on?RED:"transparent",color:on?"#FFF":"#4B5563",
                    fontSize:13,fontWeight:on?600:400,whiteSpace:"nowrap",transition:"all .15s"}}>
                  {t.label}
                  {feed&&cnt>0&&<span style={{marginLeft:4,opacity:.6,fontSize:11}}>({cnt})</span>}
                </button>
              );
            })}
          </div>
        </div>
      </header>

      {/* ── HERO BANNER ── */}
      <div style={{background:"#FFF",borderBottom:"1px solid #EBEBEB",padding:"20px 24px 18px",textAlign:"center"}}>
        <p style={{fontSize:11,color:"#9CA3AF",letterSpacing:"2px",textTransform:"uppercase",marginBottom:6}}>
          BÚSSOLA PARA ARQUITETOS DE IA
        </p>
        <p style={{fontSize:18,fontWeight:300,color:"#374151",lineHeight:1.55,maxWidth:600,margin:"0 auto"}}>
          Curadoria <strong style={{color:RED,fontWeight:600}}>ao vivo</strong> dos mercados que moldam
          a arquitetura de agentes inteligentes
        </p>
      </div>

      {/* ── MAIN ── */}
      <main style={{maxWidth:1240,margin:"0 auto",padding:"32px 24px 60px"}}>

        {/* loading */}
        {loading&&(
          <div style={{textAlign:"center",padding:"80px 0"}}>
            <div style={{width:36,height:36,border:"3px solid #E5E7EB",borderTopColor:RED,
              borderRadius:"50%",animation:"spin .8s linear infinite",margin:"0 auto 16px"}}/>
            <p style={{color:"#9CA3AF",fontSize:14}}>Carregando feed...</p>
          </div>
        )}

        {/* error */}
        {error&&(
          <div style={{textAlign:"center",padding:"80px 0"}}>
            <p style={{fontSize:36,marginBottom:12}}>⚠️</p>
            <p style={{fontSize:14,color:"#6B7280"}}>Não foi possível carregar o feed.</p>
            <p style={{fontSize:12,color:"#9CA3AF",marginTop:6}}>{error}</p>
          </div>
        )}

        {/* content */}
        {!loading&&!error&&(
          <>
            {/* featured hero — só na aba "todos" sem busca */}
            {featured&&track==="all"&&!search&&(
              <div style={{marginBottom:44}}>
                <Featured item={featured}/>
              </div>
            )}

            {/* "Latest News" label para aba todos */}
            {track==="all"&&!search&&(
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",
                marginBottom:28,paddingBottom:14,borderBottom:"2px solid #F0F0F0"}}>
                <h2 style={{fontSize:22,fontWeight:700,color:"#111"}}>Latest News</h2>
                <span style={{fontSize:13,color:RED,fontWeight:600}}>
                  {items.length} insights · automático
                </span>
              </div>
            )}

            {/* sections */}
            {visible.map(s=><Section key={s.id} title={s.label} items={s.items}/>)}

            {visible.length===0&&search&&(
              <div style={{textAlign:"center",padding:"60px 0",color:"#9CA3AF"}}>
                <p style={{fontSize:36,marginBottom:12}}>🔍</p>
                <p style={{fontSize:14}}>Nenhum resultado para "{search}"</p>
              </div>
            )}
          </>
        )}
      </main>

      {/* ── SOURCE STRIP ── */}
      {!loading&&!error&&(
        <div style={{borderTop:"1px solid #EBEBEB",background:"#FFF",padding:"28px 0"}}>
          <div style={{maxWidth:1240,margin:"0 auto",padding:"0 24px"}}>
            <p style={{fontSize:11,color:"#9CA3AF",marginBottom:18,fontWeight:600,
              textTransform:"uppercase",letterSpacing:"1.5px"}}>Fontes monitoradas</p>
            <div className="row" style={{gap:28,alignItems:"flex-start"}}>
              {[
                {label:"Salesforce",  c:"#0369A1",bg:"#DBEAFE"},
                {label:"Anthropic",   c:"#92400E",bg:"#FEF3C7"},
                {label:"OpenAI",      c:"#065F46",bg:"#D1FAE5"},
                {label:"Google AI",   c:"#1E40AF",bg:"#DBEAFE"},
                {label:"AWS",         c:"#9A3412",bg:"#FEE2E2"},
                {label:"VentureBeat", c:"#5B21B6",bg:"#EDE9FE"},
                {label:"TechCrunch",  c:"#0E7490",bg:"#CFFAFE"},
                {label:"MCP Protocol",c:"#9D174D",bg:"#FCE7F3"},
                {label:"LangChain",   c:"#065F46",bg:"#D1FAE5"},
                {label:"Langfuse",    c:"#0E7490",bg:"#CFFAFE"},
                {label:"Hacker News", c:"#C2410C",bg:"#FEF3C7"},
              ].map(s=>(
                <div key={s.label} style={{display:"flex",flexDirection:"column",
                  alignItems:"center",gap:8,flexShrink:0}}>
                  <div style={{width:52,height:52,borderRadius:"50%",background:s.bg,color:s.c,
                    fontSize:12,fontWeight:800,display:"flex",alignItems:"center",
                    justifyContent:"center",border:`2px solid ${s.c}22`,
                    boxShadow:`0 2px 8px ${s.c}18`,letterSpacing:"-0.5px"}}>
                    {s.label.slice(0,2).toUpperCase()}
                  </div>
                  <span style={{fontSize:10.5,color:"#9CA3AF",whiteSpace:"nowrap"}}>{s.label}</span>
                </div>
              ))}
            </div>
          </div>
        </div>
      )}

      {/* ── FOOTER ── */}
      <footer style={{borderTop:"1px solid #EBEBEB",padding:"18px 24px",
        textAlign:"center",background:"#FAFAFA"}}>
        <p style={{fontSize:12,color:"#D1D5DB"}}>
          RSS feeds · Gemini 1.5 Flash · Google Apps Script · Atualização automática a cada 6h
        </p>
      </footer>

    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
