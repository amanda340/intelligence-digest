fabric:{u:"Jun/2026",d:[
  {t:"Agent Fabric: control plane multi-vendor para IA empresarial",
   s:"Lançado em set/2025, expandido no TDX abr/2026. Quatro pilares: Agent Registry (catálogo central), Agent Broker (roteamento inteligente), Agent Governance (permissões e data access) e Agent Visualizer (insights em tempo real de interações e fluxos). Enterprises como Capita, Alcon e Rush University já orquestram centenas de agentes multi-plataforma.",
   d:"Posicione Agent Fabric como a resposta Salesforce para o 'agent sprawl' — problema real em contas grandes que acumularam agentes de múltiplos vendors. É o argumento de governança que justifica consolidar no stack Salesforce.",
   f:"Salesforce/MuleSoft Docs",dt:"Set/2025",tag:"Agent Fabric",alert:false,aud:["TA","Exec","SE"],
   url:"https://architect.salesforce.com/docs/architect/fundamentals/guide/mulesoft-agent-fabric-deep-dive"},
  {t:"Guided Determinism: Salesforce admite que autonomia total não está pronta",
   s:"Agent Script for Agent Broker permite definir regras fixas para handoffs críticos (escalada de reclamação, processos de reembolso) enquanto o LLM raciocina livremente entre os passos. Sirocco Group: 'É o reconhecimento público de que orquestração multi-agente totalmente autônoma não é enterprise-ready'.",
   d:"Use guided determinism como argumento de maturidade: autonomia calibrada é mais vendável que autonomia total em contas enterprise com compliance. Documenta a decisão arquitetural Router + Agent Script no Projeto Solar.",
   f:"Salesforce/UCToday/Sirocco",dt:"Abr/2026",tag:"Guided Det",alert:false,aud:["TA","Build"],url:null},
  {t:"MCP Bridge: APIs existentes viram ferramentas agênticas sem código",
   s:"Nova capacidade do Agent Fabric transforma APIs existentes (REST, SOAP, GraphQL) em MCP servers automaticamente — sem refatoração de código. Informatica-hosted MCPs aparecem automaticamente no Agent Registry, garantindo que cada interação de agente começa com dados governados.",
   d:"MCP Bridge elimina o argumento 'precisamos refatorar tudo antes de ter agentes'. Qualquer API existente pode virar ferramenta de agente hoje — reduz drasticamente o tempo de integração em projetos Agentforce.",
   f:"Salesforce/InfoWorld",dt:"Abr/2026",tag:"MCP Bridge",alert:false,aud:["TA","Build"],url:null},
  {t:"Descoberta automática: Bedrock, Microsoft Foundry e GoDaddy no Registry",
   s:"Agent Fabric agora descobre automaticamente agentes rodando no Amazon Bedrock, Microsoft Foundry e GoDaddy, além dos agents Salesforce nativos. Disponível nas novas regiões Canadá e Japão com suporte a Flex Gateway em Runtime Fabric.",
   d:"A descoberta cross-vendor é o diferencial de plataforma vs framework. Torna o argumento 'single pane of glass' concreto — todos os agentes da empresa visíveis e governados, independente de onde foram construídos.",
   f:"Salesforce/TDX",dt:"Abr/2026",tag:"Agent Fabric",alert:false,aud:["TA","Exec"],url:null},
]},

  {t:"Agentforce 360 GA: Builder, Agent Script, Voice e Intelligent Context",
   s:"Quatro capacidades em GA: Agentforce Builder, Agent Script (controle de fluxo determinístico), Agentforce Voice e Intelligent Context (grounding em dados não estruturados). Plataforma unificada: Agentforce 360 + Data 360 + Customer 360 Apps + Slack. 29k deals, ~US$800M ARR, 60% dos clientes em produção.",

  {t:"Agentforce in Setup (beta): prompt bar em todas as páginas de configuração",
   s:"Disponível em todo o Setup com prompt bar, recomendações contextuais e métricas acionáveis do próprio org. Vai além de reset de senha — apoia decisões complexas de configuração de permissões, validações e automações.",

  {t:"Spring '26: Sales Workspace, rollout em 3 fases e governança de automação",
   s:"Sales Workspace unifica insights de reps, tasks e orientação preditiva de Agentforce em uma interface. Rollout: 16/jan, 13/fev, 20/fev por instance group. Reforço de governança de automação para times globais.",
   d:"Verifique data de upgrade no Trust Maintenance Calendar. Revise Lightning Pages e customizações de home que conflitam com Sales Workspace — é comum gerar bloqueios em clientes com layouts muito customizados.",

agnostic:{u:"Jun/2026",d:[
  {t:"Google Cloud Next 2026: A2A nativo em LangGraph, CrewAI, AutoGen e Semantic Kernel",
   s:"Google declara 'The Agentic Cloud'. A2A protocol agora integrado nativamente em LangGraph, CrewAI, LlamaIndex Agents, Semantic Kernel e AutoGen. Google ADK v1.0 estável em Python, Go, Java e TypeScript — model-agnostic, deployável em container/Kubernetes. Project Mariner (browser agent) foi descontinuado e absorvido pelo Gemini Agent.",
   d:"A2A virou padrão multi-framework — não é mais só Google. Qualquer stack que usa LangGraph ou CrewAI já tem A2A. Isso acelera a adoção do protocolo e reforça o argumento de interoperabilidade do Agent Fabric.",
   f:"The Next Web",dt:"Mai/2026",tag:"Google",alert:true,aud:["TA","Build"],url:null},
  {t:"Anthropic vs OpenAI: batalha pelo control plane de agentes enterprise",
   s:"VentureBeat rastreia que Microsoft lidera em orquestração enterprise, OpenAI cresce (23→25% market share Q1). Anthropic tem primeiro foothold mensurável no orchestration layer. Bristol Myers Squibb, Snowflake e parceiros como Cognizant e CGI estão no centro da disputa. Claude ganha onde safety, long context e governance importam.",
   d:"A briga não é mais pelo melhor modelo — é por quem controla onde o agente roda e quão difícil é sair. Posicione Agentforce como o layer de aplicação sobre o modelo, com a Einstein Trust Layer como moat.",
   f:"VentureBeat/MarketingProfs",dt:"Mai/2026",tag:"Anthropic",alert:false,aud:["Exec","SE","TA"],url:null},
  {t:"OpenAI lança modelos de voz em tempo real e Guaranteed Capacity anual",
   s:"GPT-Realtime-2 (conversação), GPT-Realtime-Translate (70+ idiomas) e GPT-Realtime-Whisper (live transcription). Novo modelo de Guaranteed Capacity: reservas de compute de 1/2/3 anos com desconto — resposta ao Anthropic Priority Tier. Enterprise revenue já é 40% da receita total da OpenAI.",
   d:"Voz em tempo real com tradução multilingual é diferencial para casos de uso de atendimento global — área onde Agentforce Voice compete diretamente. Monitore para posicionamento no próximo ciclo de deals.",
   f:"MarketingProfs/GitHub",dt:"Mai/2026",tag:"OpenAI",alert:false,aud:["SE","Exec","TA"],url:null},
  {t:"WebMCP: origem trial no Chrome 149 começa a moldar o padrão open",
   s:"Google I/O 2026: origin trial do WebMCP no Chrome 149 abre coleta de feedback para o standard de acesso a tools por agentes via browser. Se aprovado, qualquer página web poderá expor tools para agentes — extensão natural do MCP para o ambiente web.",
   d:"WebMCP pode transformar qualquer interface web em ponto de integração para agentes. Monitore para avaliar impacto em automações RPA e cenários de web automation que hoje dependem de Playwright/Selenium.",
   f:"Jeffrey Stop/Google Blog",dt:"Mai/2026",tag:"Padrão",alert:false,aud:["Build","TA"],url:null},
  {t:"Kore.ai Artemis: desafiante do Copilot Studio e Agentforce no Azure",
   s:"Lançado em mai/2026 no Azure. Plataforma agent-native com Agent Blueprint Language (ABL) — linguagem YAML declarativa para workflows multi-agente. Posicionado como desafio estrutural ao Copilot Studio e Agentforce em médias empresas.",
   d:"Novo entrante enterprise com posicionamento declarativo vs low-code. Monitore especialmente em contas Azure-first que ainda não têm Salesforce. A ABL pode influenciar como standards de definição de agentes evoluem.",
   f:"GitHub awesome-ai-agents-2026",dt:"Mai/2026",tag:"Microsoft",alert:false,aud:["TA","SE"],url:null},
  {t:"Gartner: primeiro Magic Quadrant para AI Coding Agents — mercado atinge maturidade",
   s:"Primeiro MQ da Gartner para Enterprise AI Coding Agents (2026). Cursor e OpenAI Codex como Líderes; Cline e Windsurf como Desafiantes. Claude Code da Anthropic é o motivo pelo qual OpenAI e Microsoft/Google aceleraram investimento em coding agents.",
   d:"O surgimento de um MQ sinaliza maturidade de mercado. Para consultores Salesforce: coding agents (especialmente Claude Code) estão mudando o velocity de desenvolvimento em projetos — inclua nas estimativas.",
   f:"Gartner/GitHub",dt:"2026",tag:"Mercado",alert:false,aud:["Exec","SE","TA"],url:null},
]},

rivals:{u:"Jun/2026",d:[
  {t:"Microsoft Copilot Studio: 160 mil orgs, 400 mil+ agentes — o benchmark de adoção",
   s:"Maior volume de adoção low-code. M365/Teams/SharePoint/Dynamics integrados nativamente. Azure AI Foundry cuida da lógica de IA; Copilot Studio é o front-end de deploy. Microsoft perdeu momentum de desenvolvimento conforme Anthropic e OpenAI aceleraram, mas base instalada é enorme.",

  {t:"ServiceNow reestrutura pricing inteiro em tiers de autonomia de IA",
   s:"Modelo comercial redesenhado em torno de Now Assist com tiers de autonomia crescente. Junto com IBM watsonx, lidera em indústrias reguladas (EU AI Act): audit trails, explicabilidade e proveniência como features centrais. Foco absoluto em ITSM, HR e orquestração de processos internos.",

  {t:"SAP Joule roda Claude como motor primário — e vem bundled nas assinaturas",
   s:"Joule Studio com agentes nativos para ERP, HCM, SCM, finanças e CX. Tanto Joule quanto Agentforce convergem no mesmo modelo (Claude) — diferença é proximidade ao dado de negócio. Em SAP-houses: custo marginal zero.",

  {t:"AWS Bedrock + Claude SDK: o stack de build custom para >1M conversas/ano",
   s:"Q Business (US$20/user/mês, 40+ conectores). Bedrock: Claude, Titan, Llama. Para builds acima de 1M conversas/ano, Claude Agent SDK + Bedrock tem TCO menor que qualquer plataforma pacote. OpenAI Codex cresce: 3 milhões de usuários semanais, Cognizant e CGI como SIs.",

crossref:{u:"Jun/2026",d:[
  {t:"Build-vs-Buy: o ponto de virada está em ~1 milhão de conversas/ano",
   s:"Abaixo de 100K/ano: plataformas pacote vencem — overhead de engenharia não amortiza em 3 anos. Acima de 2M/ano: Claude SDK + Bedrock ou OpenAI + Azure ganham na convexidade de preço por conversa. SAP/ServiceNow/Oracle: custo marginal zero (bundled). Resultado: a decisão buy-vs-build depende de volume, não de preferência de vendor.",
   d:"Leve esse modelo para toda conversa de arquitetura. Em deals Agentforce, estimar volume de conversas não é só pricing — é o argumento que determina a estratégia de implementação.",
   f:"DigitalApplied",dt:"Mai/2026",tag:"Build-vs-Buy",alert:true,aud:["Exec","TA","SE"],url:null},
  {t:"Mapa de fit por workflow 2026: quem vai para qual plataforma",
   s:"Customer-facing → Agentforce/Kore.ai. Employee IT/HR → ServiceNow/Copilot Studio. Back-office → UiPath. Custom produção → LangGraph. Multimodal/A2A → Gemini Enterprise. SAP-native → Joule Studio. Regulado → watsonx/ServiceNow. Infra custom → Claude SDK + Bedrock.",
   d:"Em RFPs multi-domínio, proponha arquitetura híbrida: Agentforce no customer-facing integrado via Agent Fabric/MCP aos demais. Isso diferencia TA de implementador e gera SOW maior.",
   f:"MarkTechPost",dt:"Mai/2026",tag:"Decisão",alert:false,aud:["TA","SE","Exec"],url:null},
  {t:"'Agent Washing': menos de 30% dos produtos no mercado é agente de verdade",
   s:"Praticantes documentam que a maioria renomeia chatbots e RPA como agentes. IA agêntica genuína: decisão autônoma, raciocínio multi-step, tratamento dinâmico de erro. Salesforce chamou esse padrão de 'Guided Determinism' — reconhecimento público de que autonomia total ainda não é enterprise-ready.",
   d:"Em avaliações competitivas, teste com tarefa ambígua multi-step sem script. Veja se há replanejamento. É o teste mais honesto e diferencia Agentforce (com mecanismos reais de reasoning) de concorrentes que fazem agent washing.",
   f:"MarkTechPost",dt:"Mai/2026",tag:"Agent Wash",alert:false,aud:["SE","TA"],url:null},
]},

// ══════════ ARQUITETURA & MCP/A2A ══════════
arch:{u:"Jun/2026",d:[
  {t:"MCP + A2A: Agentic AI Foundation sob a Linux Foundation (neutralidade garantida)",
   s:"Dez/2025: Anthropic, Block e OpenAI criam AAF sob Linux Foundation. MCP = como agentes acessam tools (Tools, Resources, Prompts via JSON-RPC 2.0, OAuth 2.1). A2A = como agentes colaboram (delegação, negociação, coordenação). Complementares. Em 2026, A2A integrado nativamente em LangGraph, CrewAI, AutoGen, Semantic Kernel.",
   d:"Padronize acesso a tools via MCP e comunicação via A2A. Governança da Linux Foundation elimina lock-in. Salesforce Agent Fabric (Registry, Broker, MCP Bridge) implementa esse padrão — use isso no argumento de abertura.",
   f:"DEV Community",dt:"Dez/2025",tag:"MCP",alert:false,aud:["TA","Build"],url:null},
  {t:"Padrão multi-agent de produção: orquestrador + registro dinâmico de agentes",
   s:"Validado em produção (Oracle/Rush University): orquestrador detecta intenção e roteia para sub-agentes especializados via registro dinâmico. Novos agentes se registram e ficam disponíveis sem reescrever código. Falhas isoladas não cascateiam. Bancos e APIs expõem tools via MCP sem virar agentes.",
   d:"Adote registro dinâmico em vez de roteamento hardcoded. Esse é exatamente o padrão do FinDiagAgent v12: Router + SF_AgenticGateway + subagente consolidado em vez dos 7 subagentes misturados do legado IBM.",
   f:"Oracle Blogs",dt:"Abr/2026",tag:"Multi-Agent",alert:false,aud:["TA","Build"],url:null},
  {t:"Gap crítico de observabilidade: stack de 3 camadas, 3 streams de log diferentes",
   s:"WebMCP → MCP → A2A exige instrumentação separada. Quando task A2A falha: foi roteamento de delegação, tool MCP ou acesso WebMCP? Hoje = 3 streams distintos. Nenhuma ferramenta unifica as 3 camadas em trace único — identificado como o maior gap de produção em 2026.",
   d:"Exija observabilidade unificada como requisito de produção — não nice-to-have. É o argumento técnico para Langfuse/LandCrest no escopo. Sem isso, não tem SLA possível em produção.",
   f:"DEV Community",dt:"Mar/2026",tag:"A2A",alert:true,aud:["TA","Build"],url:null},
  {t:"MCP 2026 roadmap: stateless, Server Cards e descoberta automática",
   s:"H2/2026: operação stateless, Server Cards para auto-discovery, OAuth 2.1 obrigatório, Streamable HTTP como transporte remoto padrão. MCP evolui de conexão de tool individual para infraestrutura de orquestração multi-agente. WebMCP (Chrome 149) estende o protocolo para o browser.",
   d:"Projete integrações MCP já stateless — arquiteturas com sessão stateful hoje precisarão de refactor. Alinhe com o MCP Connector da Salesforce e o MCP Bridge do Agent Fabric.",
   f:"DEV / x4nent",dt:"Abr/2026",tag:"Padrão",alert:false,aud:["TA","Build"],url:null},
]},

// ══════════ LLMOPS & FERRAMENTAS ══════════
tools:{u:"Jun/2026",d:[
  {t:"Langfuse vira camada de trace obrigatória em redes multi-agente de produção",
   s:"Plataformas de produção (Oracle, Rush University, clientes enterprise) usam Langfuse para trace end-to-end: detecção de intenção → roteamento de sub-agentes → invocações MCP. Cada agente tem spans individuais com latência e custo de tokens visíveis. Langfuse MCP server (jun/2026) permite que agentes auto-diagnostiquem traces.",
   d:"Inclua Langfuse ou LandCrest desde o PoC. Sem trace por agente, não há diagnóstico em produção nem argumento de otimização de Flex Credits. É o requisito que separa PoC de arquitetura production-ready.",
   f:"Oracle Blogs/GitHub",dt:"Jun/2026",tag:"Langfuse",alert:false,aud:["TA","Build"],url:null},
  {t:"Stack de referência 2026: LangGraph + MCP + A2A + Langfuse + DeepEval",
   s:"Arquitetura completa documentada como production-ready (freeCodeCamp, abr/2026): LangGraph orquestra, MCP acessa tools, A2A delega cross-framework (incluindo CrewAI), Langfuse captura traces, DeepEval roda quality checks automáticos. Cada camada previne um modo de falha específico.",
   d:"Use como checklist de maturidade de arquitetura: orquestração / tools / colaboração / observabilidade / avaliação automática. Camada faltando = risco de produção nomeável — argumento para expandir escopo.",
   f:"freeCodeCamp",dt:"Abr/2026",tag:"LLMOps",alert:false,aud:["TA","Build"],url:null},
  {t:"Anthropic endurece limites de uso de agentes por custos computacionais",
   s:"Mai/2026: Anthropic introduz restrições e limites de crédito para usuários Claude que usam agent tools de terceiros. Workflows autônomos multi-step elevam drasticamente consumo de tokens. Backlash de power users. OpenAI responde com incentivos de uso gratuito do Codex.",
   d:"Sinal de mercado: a economia de agentes autônomos está sob pressão em modelos 'ilimitados'. Em propostas Agentforce, o modelo de Flex Credits (pay-per-use) é mais sustentável para o cliente do que assinatura flat — use isso.",

function AudBadge({r}){const a=AUD[r];return(
  <span style={{background:a.b,color:a.c,border:`1px solid ${a.c}40`,borderRadius:12,padding:"1px 7px",fontSize:9.5,fontWeight:700,whiteSpace:"nowrap"}}>{a.l}</span>
);}

function Card({item}){
  const [open,setOpen]=useState(false);
  const c=TAG[item.tag]||"#6B7280";
  return(
    <div onClick={()=>setOpen(v=>!v)} style={{
      background:"rgba(13,21,38,.88)",
      border:`1px solid ${item.alert?"rgba(251,191,36,.3)":"rgba(255,255,255,.06)"}`,
      borderLeft:`3px solid ${item.alert?"#FBBF24":c}`,
      borderRadius:10,padding:"13px 15px",cursor:"pointer",marginBottom:8,
      transition:"transform .15s,box-shadow .15s",
      animation:item.alert?"alertglow 2.5s ease-in-out infinite":"none",
    }}
    onMouseEnter={e=>{e.currentTarget.style.transform="translateY(-1px)";e.currentTarget.style.boxShadow=`0 4px 18px ${c}22`;}}
    onMouseLeave={e=>{e.currentTarget.style.transform="";e.currentTarget.style.boxShadow="";}}>
      <div style={{display:"flex",gap:8,alignItems:"flex-start",marginBottom:6}}>
        <div style={{flex:1}}>
          {item.alert&&<span style={{background:"rgba(251,191,36,.15)",color:"#FBBF24",border:"1px solid rgba(251,191,36,.35)",borderRadius:20,padding:"1px 8px",fontSize:9.5,fontWeight:700,marginBottom:4,display:"inline-block"}}>⚡ ALERTA</span>}
          <h3 style={{margin:"2px 0 0",fontSize:13.5,fontWeight:600,color:"#E2E8F0",lineHeight:1.45}}>{item.t}</h3>
        </div>
        <span style={{background:c+"18",color:c,border:`1px solid ${c}30`,borderRadius:20,padding:"2px 8px",fontSize:10,fontWeight:700,whiteSpace:"nowrap",flexShrink:0}}>{item.tag}</span>
      </div>
      <div style={{display:"flex",gap:4,flexWrap:"wrap",marginBottom:7}}>
        {item.aud.map(r=><AudBadge key={r} r={r}/>)}
      </div>
      <p style={{margin:"0 0 8px",fontSize:12.5,color:"#94A3B8",lineHeight:1.6}}>{item.s}</p>
      {open&&(
        <div style={{background:"rgba(168,85,247,.07)",border:"1px solid rgba(168,85,247,.2)",borderRadius:7,padding:"9px 12px",marginBottom:8}}>
          <p style={{margin:0,fontSize:12,color:"#C4B5FD",lineHeight:1.55}}>
            <strong style={{color:"#A78BFA"}}>🏛️ Decisão arquitetural: </strong>{item.d}
          </p>
        </div>
      )}
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",flexWrap:"wrap",gap:6}}>
        <span style={{fontSize:10.5,color:"#2D3E55"}}>📰 {item.f} · {item.dt}</span>
        <div style={{display:"flex",gap:8,alignItems:"center"}}>
          {item.url&&<a href={item.url} target="_blank" rel="noopener noreferrer" onClick={e=>e.stopPropagation()} style={{fontSize:10.5,color:"#38BDF8",textDecoration:"none"}}>🔗 fonte</a>}
          <span style={{fontSize:10.5,color:"#A78BFA"}}>{open?"▲":"▼ decisão"}</span>
        </div>
      </div>
    </div>
  );
}

function App(){
  const [tid,setTid]=useState("hot");
  const [aud,setAud]=useState(null);
  const tr=TRACKS.find(t=>t.id===tid);
  const data=N[tid];
  const items=useMemo(()=>aud?data.d.filter(i=>i.aud.includes(aud)):data.d,[tid,aud]);
  const totalAlerts=useMemo(()=>Object.values(N).reduce((s,t)=>s+t.d.filter(i=>i.alert).length,0),[]);
  const totalItems=useMemo(()=>Object.values(N).reduce((s,t)=>s+t.d.length,0),[]);

  return(
    <div style={{minHeight:"100vh",paddingBottom:40}}>
      {/* HEADER */}
      <div style={{background:"rgba(2,8,23,.94)",borderBottom:"1px solid rgba(255,255,255,.06)",padding:"13px 16px 13px",position:"sticky",top:0,zIndex:10,backdropFilter:"blur(16px)"}}>
        <div style={{maxWidth:900,margin:"0 auto"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:11}}>
            <div>
              <div style={{display:"flex",alignItems:"center",gap:7,marginBottom:3}}>
                <span style={{width:6,height:6,borderRadius:"50%",background:"#00A1E0",boxShadow:"0 0 6px #00A1E0",display:"inline-block",animation:"pulse 2s infinite"}}/>
                <span style={{fontSize:"9.5px",color:"#38BDF8",fontWeight:700,letterSpacing:"1.8px",textTransform:"uppercase"}}>RADAR · ARQUITETOS SALESFORCE · Jun 2026</span>
              </div>
              <h1 style={{margin:0,fontSize:20,fontWeight:800,background:"linear-gradient(135deg,#E2E8F0,#A78BFA)",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>Intelligence Digest</h1>
            </div>
            <div style={{textAlign:"right"}}>
              <div style={{fontSize:10,color:"#1E293B",marginBottom:4}}>{new Date().toLocaleDateString("pt-BR",{weekday:"short",day:"2-digit",month:"short",year:"numeric"})}</div>
              <div style={{background:"rgba(251,191,36,.12)",border:"1px solid rgba(251,191,36,.35)",borderRadius:20,padding:"2px 9px",fontSize:10.5,color:"#FBBF24",fontWeight:700,display:"inline-block"}}>⚡ {totalAlerts} alertas · {totalItems} insights</div>
            </div>
          </div>
          {/* TABS */}
          <div style={{display:"flex",flexWrap:"wrap",gap:5,marginBottom:9}}>
            {TRACKS.map(t=>{
              const on=tid===t.id;
              const cnt=N[t.id]?.d.length||0;
              const alerts=N[t.id]?.d.filter(i=>i.alert).length||0;
              return(
                <button key={t.id} onClick={()=>{setTid(t.id);setAud(null);}} style={{
                  background:on?`linear-gradient(135deg,${t.color},${t.color}99)`:t.color+"12",
                  border:`1px solid ${on?t.color:alerts>0?"rgba(251,191,36,.4)":t.color+"35"}`,
                  borderRadius:18,padding:"6px 12px",color:on?"#fff":t.color,
                  fontSize:11.5,fontWeight:on?700:500,cursor:"pointer",
                  display:"flex",alignItems:"center",gap:5,transition:"all .15s",
                  boxShadow:on?`0 3px 12px ${t.color}40`:"none",position:"relative",
                }}>
                  {t.label}
                  <span style={{fontSize:9,background:on?"rgba(255,255,255,.22)":t.color+"22",borderRadius:10,padding:"1px 6px",fontWeight:700,color:on?"#fff":t.color}}>{cnt}</span>
                  {alerts>0&&!on&&<span style={{position:"absolute",top:-4,right:-4,width:14,height:14,borderRadius:"50%",background:"#FBBF24",color:"#000",fontSize:8,fontWeight:900,display:"flex",alignItems:"center",justifyContent:"center",boxShadow:"0 0 6px #FBBF24"}}>!</span>}
                </button>
              );
            })}
          </div>
          {/* AUDIENCE FILTER */}
          <div style={{display:"flex",gap:5,alignItems:"center"}}>
            <span style={{fontSize:10,color:"#334155",marginRight:2}}>Para:</span>
            {[null,"SE","TA","Build","Exec"].map(r=>{
              const a=r?AUD[r]:null;const on=aud===r;
              return(
                <button key={r||"all"} onClick={()=>setAud(r)} style={{
                  background:on?(a?a.b:"rgba(255,255,255,.08)"):"transparent",
                  border:`1px solid ${on?(a?a.c:"rgba(255,255,255,.2)"):"rgba(255,255,255,.08)"}`,
                  borderRadius:14,padding:"3px 10px",
                  color:on?(a?a.c:"#E2E8F0"):"#475569",
                  fontSize:10.5,fontWeight:on?700:400,cursor:"pointer",transition:"all .15s",
                }}>
                  {r?a.l:"Todos"}
                </button>
              );
            })}
          </div>
        </div>
      </div>
      {/* CONTENT */}
      <div style={{maxWidth:900,margin:"0 auto",padding:"18px 16px 0"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
          <div>
            <h2 style={{margin:0,fontSize:16,fontWeight:700,color:"#E2E8F0"}}>{tr.label}</h2>
            <p style={{margin:"3px 0 0",fontSize:11,color:"#2D3E55"}}>
              {items.length} insight{items.length!==1?"s":""} · curadoria {data.u}{aud?` · ${AUD[aud].l}`:""}
            </p>
          </div>
          <span style={{background:tr.color+"14",border:`1px solid ${tr.color}30`,borderRadius:20,padding:"3px 11px",fontSize:10,color:tr.color,fontWeight:700}}>✓ curadoria</span>
        </div>
        {items.length===0?(
          <div style={{textAlign:"center",padding:"40px 20px",color:"#334155"}}>
            <div style={{fontSize:36,marginBottom:10}}>🔍</div>
            <p style={{fontSize:13}}>Nenhum item para <strong style={{color:AUD[aud]?.c}}>{AUD[aud]?.l}</strong> nesta trilha.</p>
          </div>
        ):(
          items.map((item,i)=><Card key={i} item={item}/>)
        )}
        <p style={{textAlign:"center",marginTop:10,fontSize:10.5,color:"#1A2535",lineHeight:1.7}}>
          Clique em cada card para ver a decisão arquitetural ↑<br/>
          <span style={{color:"#1E3A5F"}}>Curadoria: notícias dos últimos 2 meses · atualizado Jun/2026</span>
        </p>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
